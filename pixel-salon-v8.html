function drawRoom(){
  R(0,0,W,224,P.wall);

  R(260,620,160,10,'rgba(168,120,48,0.14)');
  R(740,620,160,10,'rgba(168,120,48,0.14)');

}

//  TITLE SIGN — carved wood, hanging
// ═══════════════════════════════════════
function drawTitleSign(){

  L(sx+20,0,sx+20,sy+0,P.wdD,4);L(sx+sw-20,0,sx+sw-20,sy+0,P.wdD,4);

function drawBoard(){
  const bx=976,by=24,bw=276,bh=228;
  R(bx-6,by-6,bw+12,bh+12,P.wdD);R(bx,by,bw,bh,P.cork);R(bx+6,by+6,bw-12,bh-12,P.corkBg);

function drawCoffeeTable(x,y){
  const r=44;
  ctx.fillStyle=P.shD;ctx.beginPath();ctx.ellipse(x,y+5,r+6,16,0,0,Math.PI*2);ctx.fill();

  ctx.fillStyle=P.wdL;ctx.beginPath();ctx.ellipse(x,y,r,14,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=P.wd;ctx.beginPath();ctx.ellipse(x,y-2,r-3,10,0,0,Math.PI*2);ctx.fill();
  R(x-16,y-9,14,8,P.paper);R(x-14,y-7,10,3,P.ink);
  R(x+6,y-8,10,10,P.gold);R(x+8,y-6,6,6,'#F4E8C8');

// ── Side furniture (keepers, repositioned) ──
function drawTallPlant(x,y){R(x+4,y+44,28,20,P.pot);R(x+8,y+40,20,6,P.potD);R(x+6,y-8,6,40,P.g1);R(x+12,y-14,8,48,P.g2);R(x+18,y-4,6,36,P.g3);R(x+22,y-2,4,28,P.g4)}
function drawLamp(x,y){R(x+6,y+28,12,4,P.wdD);R(x+10,y-20,4,52,P.wd);R(x+4,y-24,16,14,P.gold);R(x+6,y-20,12,6,'#F4E8C8');ctx.fillStyle='rgba(255,240,200,0.1)';ctx.beginPath();ctx.arc(x+12,y+4,44,0,Math.PI*2);ctx.fill()}
function drawCoatRack(x,y){R(x+8,y-12,4,60,P.wdD);R(x+10,y+44,10,4,P.wdD);R(x+4,y-16,16,6,P.wd);R(x+2,y-16,2,8,P.wdD);R(x+14,y-16,2,8,P.wdD);R(x+14,y-12,10,20,P.red);R(x+16,y-8,6,12,P.redD)}

  R(x+4,y+8,48,16,P.wdD);R(x,y,56,10,P.wd);R(x,y-4,6,8,P.wdD);R(x+50,y-4,6,8,P.wdD);

function drawSmallPlant(x,y){R(x,y+24,20,16,P.pot);R(x+4,y+20,12,6,P.potD);R(x+2,y+4,4,18,P.g1);R(x+6,y,6,22,P.g2);R(x+12,y+6,4,16,P.g3)}

// ═══════════════════════════════════════

function drawChar(c,hv,f){
  const s=4.4,cx=c.x,cy=c.y-(c.pose==='sit'?6:0),ox=cx-5*s,oy=cy-22*s;
  ctx.save();
  ctx.fillStyle=P.sh;ctx.beginPath();ctx.ellipse(cx,cy+3,13,3.5,0,0,Math.PI*2);ctx.fill();
  // Legs
  if(c.pose==='stand'||c.pose==='lean'){
    R(ox+2*s,oy+16*s,2*s,7*s,c.bot);R(ox+8*s,oy+16*s,2*s,7*s,c.bot);
    R(ox+2*s,oy+22*s,2*s,1.5*s,'#2A2A3A');R(ox+8*s,oy+22*s,2*s,1.5*s,'#2A2A3A');
  }else if(c.pose==='sit'){
    R(ox+1*s,oy+15*s,3*s,3*s,c.bot);R(ox+1*s,oy+17*s,2*s,4*s,c.bot);R(ox+8*s,oy+17*s,2*s,4*s,c.bot);
  }else{
    const l=Math.sin(f*0.15)*2.2;
    R(ox+2*s,oy+16*s,2*s,7*s+l,c.bot);R(ox+8*s,oy+16*s,2*s,7*s-l,c.bot);
  }
  // Body
  if(c.pose==='sit'){R(ox+1.5*s,oy+9*s,9*s,7*s,c.top);R(ox+1.5*s,oy+13*s,9*s,2.5*s,c.t2)}
  else{R(ox+1.5*s,oy+9*s,9*s,8*s,c.top);R(ox+1.5*s,oy+14*s,9*s,2.5*s,c.t2)}
  // Arms
  if(c.pose==='stand'){R(ox+0.5*s,oy+9*s,2*s,6*s,c.top);R(ox+9.5*s,oy+9*s,2*s,6*s,c.top)}
  else if(c.pose==='sit'){R(ox+0.5*s,oy+9*s,2*s,5*s,c.top);R(ox+9.5*s,oy+10*s,2*s,4*s,c.top)}
  else if(c.pose==='walk'){const a=Math.sin(f*0.15)*2;R(ox+0.5*s,oy+9*s,2*s,7*s+a,c.top);R(ox+9.5*s,oy+9*s,2*s,7*s-a,c.top)}
  else{R(ox+0.5*s,oy+9*s,2*s,5*s,c.top);R(ox+9*s,oy+7*s,2*s,5*s,c.top)}
  // Head
  R(ox+0.5*s,oy-2*s,11*s,5*s,c.hr);R(ox+0.5*s,oy+1*s,2*s,5*s,c.hr);R(ox+9.5*s,oy+1*s,2*s,5*s,c.hr);
  R(ox+2*s,oy,8*s,6*s,c.sx);
  if(c.dir>=0){R(ox+5*s,oy+2.5*s,2*s,1.5*s,'#1A1A1A');R(ox+9*s,oy+2.5*s,2*s,1.5*s,'#1A1A1A')}
  else{R(ox+4*s,oy+2.5*s,2*s,1.5*s,'#1A1A1A');R(ox+8*s,oy+2.5*s,2*s,1.5*s,'#1A1A1A')}
  R(ox+3*s,oy+3.5*s,1.5*s,1*s,'rgba(200,100,100,0.4)');R(ox+8.5*s,oy+3.5*s,1.5*s,1*s,'rgba(200,100,100,0.4)');
  R(ox+6*s,oy+5*s,1.5*s,0.8*s,'#8B5E5E');
  R(ox+1*s,oy-1*s,10*s,2*s,c.hr2);
  if(Math.floor(f/150)%3===0&&f%150<5)R(ox+3*s,oy+3*s,7*s,1*s,c.sx);
  if(hv){ctx.strokeStyle='rgba(212,168,67,0.7)';ctx.lineWidth=1.2;ctx.beginPath();ctx.roundRect(ox-2,oy-4,14*s,25*s,3);ctx.stroke();ctx.fillStyle='#3D2B1F';ctx.font='bold 14px "Microsoft YaHei"';ctx.textAlign='center';ctx.fillText('点击加入讨论',cx,oy-7);ctx.textAlign='start'}
  ctx.fillStyle='#6B5B4A';ctx.font='12px "Microsoft YaHei"';ctx.textAlign='center';ctx.fillText(c.name,cx,c.pose==='sit'?cy+2:cy+6);ctx.textAlign='start';
  ctx.restore();
  drawBubble(cx,oy-5,c.topic,hv?P.gold:P.ink);
}

function drawBubble(cx,ty,ti,color){
  const t=topics[ti],txt=t.title.length>9?t.title.slice(0,9)+'…':t.title;
  ctx.font='bold 14px "Microsoft YaHei"';const tw=ctx.measureText(txt).width,bw=tw+24,bh=30,bx=cx-bw/2,by=ty-bh-6;
  R(bx,by,bw,bh,'#FFFFFF');ctx.strokeStyle=color;ctx.lineWidth=1.6;ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle='#FFFFFF';ctx.beginPath();ctx.moveTo(cx-6,ty-6);ctx.lineTo(cx,ty+2);ctx.lineTo(cx+6,ty-6);ctx.fill();ctx.stroke();
  ctx.fillStyle=color;ctx.fillText(txt,bx+10,by+24);
}

// ═══ Hit Detection ═══
function hitChar(mx,my){
  const r=c.getBoundingClientRect(),sx=W/r.width,sy=H/r.height,cx=(mx-r.left)*sx,cy=(my-r.top)*sy;
  for(let i=chars.length-1;i>=0;i--){const c2=chars[i],dx=cx-c2.x,dy=cy-(c2.y-22);if(dx*dx+dy*dy<48*48)return i}return -1;
}

// ═══ Init & Animate ═══
let chars=charDefs.map(d=>({...d})),hv=-1,f=0;
c.addEventListener('mousemove',e=>{const h=hitChar(e.clientX,e.clientY);if(h!==hv){hv=h;c.style.cursor=h>=0?'pointer':'default'}});
c.addEventListener('click',e=>{const h=hitChar(e.clientX,e.clientY);if(h>=0)window.location.href='pixel-discussion-v3.html?topic='+encodeURIComponent(topics[chars[h].topic].title)});
c.addEventListener('mouseleave',()=>{hv=-1});

function tick(){
  f++;
  
  // ── DRAW ORDER: back wall → furniture → armchairs → characters ──
  drawRoom();
  drawTitleSign();
  drawBoard();
  drawWindow(80,50);
  
  // Furniture — back to front
  drawRightSide();
  drawLeftSide();
  drawCircle();
  drawAllArmchairs();
  
  // Characters (draw sitting on sofa/armchairs)
  chars.forEach((c,i)=>drawChar(c,i===hv,f));
  
  requestAnimationFrame(tick);
}tick();
</script>
