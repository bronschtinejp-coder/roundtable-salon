<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回响圆桌 · 讨论中</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap');
  
  :root {
    --cream: #FBF6E8;
    --wood: #8B6914;
    --wood-dark: #6B4E1B;
    --green: #2D6A4F;
    --red: #C84B31;
    --gold: #D4A843;
    --navy: #264653;
    --dark: #2D2D2D;
    --panel-bg: #FBF6E8;
    --msg-self: #264653;
    --msg-other: #FFFFFF;
    --border: #D4C4A0;
  }
  
  * { margin:0; padding:0; box-sizing:border-box; }
  
  body {
    background: #3D2B1F;
    font-family: 'Noto Sans SC', sans-serif;
    overflow: hidden;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  
  #container {
    position: relative;
    width: 100vw; height: 100vh;
    max-width: 1280px; max-height: 720px;
    aspect-ratio: 16/9;
    display: flex;
  }
  
  /* ═══ Left: Room Scene ═══ */
  #scene-area {
    flex: 0 0 55%;
    position: relative;
  }
  #pixel-canvas {
    position: absolute; top:0; left:0;
    width: 100%; height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  
  /* ═══ Right: Chat Panel ═══ */
  #chat-panel {
    flex: 1;
    display: flex; flex-direction: column;
    background: var(--panel-bg);
    border-left: 4px solid var(--wood-dark);
    font-size: 13px;
  }
  
  #chat-header {
    padding: 12px 14px;
    font-weight: 700;
    color: var(--dark);
    border-bottom: 2px solid var(--border);
    letter-spacing: 3px;
    text-align: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  
  #chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px;
    display: flex; flex-direction: column;
    gap: 8px;
    scroll-behavior: smooth;
  }
  
  .msg {
    display: flex; flex-direction: column;
    max-width: 90%;
    animation: fadeIn 0.25s ease;
  }
  .msg.self { align-self: flex-end; }
  .msg.other { align-self: flex-start; }
  
  .msg .name {
    font-size: 10px; font-weight: 700;
    margin-bottom: 2px; padding: 0 4px;
  }
  .msg.self .name { text-align: right; color: var(--red); }
  .msg.other .name { color: var(--navy); }
  
  .msg .bubble {
    padding: 7px 10px;
    border-radius: 2px;
    font-size: 12px; line-height: 1.5;
    word-break: break-word;
  }
  .msg.self .bubble { background: var(--dark); color: #FBF6E8; }
  .msg.other .bubble { background: var(--msg-other); color: var(--dark); border: 1px solid var(--border); }
  
  .msg .time {
    font-size: 9px; color: #999;
    margin-top: 2px; padding: 0 4px;
  }
  .msg.self .time { text-align: right; }
  
  @keyframes fadeIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }
  
  /* Typing indicator */
  #typing-indicator {
    padding: 4px 12px 8px;
    font-size: 11px; color: #999; font-style: italic;
    min-height: 20px; flex-shrink: 0;
  }
  
  /* Input */
  #chat-input-wrap {
    padding: 10px 12px;
    border-top: 2px solid var(--border);
    display: flex; gap: 6px;
    flex-shrink: 0;
  }
  #chat-input-wrap input {
    flex: 1;
    border: 2px solid var(--border);
    padding: 8px 10px;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 13px;
    background: #FFF;
    color: var(--dark);
    outline: none;
  }
  #chat-input-wrap input:focus { border-color: var(--wood); }
  #chat-input-wrap button {
    border: 2px solid var(--dark);
    background: var(--dark);
    color: #FBF6E8;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 12px; font-weight: 700;
    padding: 8px 16px; cursor: pointer;
    letter-spacing: 2px;
    white-space: nowrap;
  }
  #chat-input-wrap button:hover { background: var(--red); border-color: var(--red); }
  
  /* Back button */
  #back-btn {
    position: absolute; top: 8px; left: 8px;
    z-index: 5;
    background: rgba(251,246,232,0.9);
    border: 2px solid var(--wood-dark);
    color: var(--dark);
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 11px; font-weight: 700;
    padding: 5px 10px; cursor: pointer;
  }
  #back-btn:hover { color: var(--red); border-color: var(--red); }
</style>
</head>
<body>
<div id="container">
  <div id="scene-area">
    <canvas id="pixel-canvas"></canvas>
    <button id="back-btn" onclick="history.back()">← 返回沙龙</button>
  </div>
  
  <div id="chat-panel">
    <div id="chat-header" id="topic-title-display">💬 讨论中</div>
    <div id="chat-messages"></div>
    <div id="typing-indicator"></div>
    <div id="chat-input-wrap">
      <input type="text" id="msg-input" placeholder="输入你的观点，加入讨论…" maxlength="100" />
      <button onclick="sendMsg()">发 言</button>
    </div>
  </div>
</div>

<script>
// ═══════════════ Canvas Scene ═══════════════
const W=350, H=360;
const canvas=document.getElementById('pixel-canvas');
const ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;

const P={
  wall:'#F5E6C8', wallTrim:'#D4C4A0', floor:'#B8863C',
  floorLine:'#A0722C', rug:'#C84B31', rugAccent:'#E8A860',
  wood:'#6B4226', woodLt:'#8B5E3C', woodDk:'#4A2C18',
  green:'#2D6A4F', greenLt:'#40916C', gold:'#D4A843',
  shadow:'rgba(0,0,0,0.08)',
};

function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w|0,h|0);}

const charColors=[
  {name:'阿哲',skin:'#F4C9A8',hair:'#2D1B0E',shirt:'#264653',pants:'#3D3D5C'},
  {name:'小棠',skin:'#FDE0C8',hair:'#3A1F0D',shirt:'#C84B31',pants:'#4A4A6A'},
  {name:'青叶',skin:'#F5D6C0',hair:'#1A1A2E',shirt:'#2D6A4F',pants:'#5A5A6A'},
  {name:'言午',skin:'#F0C8A8',hair:'#4A3520',shirt:'#D4A843',pants:'#3D3A4A'},
  {name:'蓝山',skin:'#F8D8C0',hair:'#2C1810',shirt:'#457B9D',pants:'#4A4A5A'},
];

let frame=0;
let activeSpeaker=-1;

function drawChar(cx,cy,c,i,isActive) {
  const sc=2, ox=cx-5*sc, oy=cy-17*sc;
  ctx.save();
  // Shadow
  ctx.fillStyle=P.shadow;
  ctx.beginPath(); ctx.ellipse(cx,cy+3,12,3,0,0,Math.PI*2); ctx.fill();
  // Legs
  rect(ox+1.5*sc,oy+12*sc,2*sc,5*sc,c.pants);
  rect(ox+7*sc,oy+12*sc,2*sc,5*sc,c.pants);
  // Body
  rect(ox+1*sc,oy+6*sc,9*sc,7*sc,c.shirt);
  // Arms (gesturing if active)
  if(isActive){
    rect(ox,oy+5*sc,2*sc,6*sc,c.shirt);
    rect(ox+9*sc,oy+4*sc,2*sc,6*sc,c.shirt);
  }else{
    rect(ox,oy+6*sc,2*sc,5.5*sc,c.shirt);
    rect(ox+9*sc,oy+6*sc,2*sc,5.5*sc,c.shirt);
  }
  // Head
  rect(ox+1*sc,oy-1*sc,9*sc,6*sc,c.hair);
  rect(ox+2*sc,oy,7*sc,5*sc,c.skin);
  rect(ox+4.5*sc,oy+2*sc,1.5*sc,1*sc,'#1A1A1A');
  rect(ox+7*sc,oy+2*sc,1.5*sc,1*sc,'#1A1A1A');
  rect(ox+5.5*sc,oy+4*sc,1.5*sc,0.8*sc,'#6B4444');
  rect(ox+2*sc,oy-1*sc,7*sc,1.5*sc,c.hair);
  
  // Active glow
  if(isActive){
    ctx.strokeStyle='rgba(212,168,67,0.6)';
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(ox-2,oy-4,15*sc,22*sc,3); ctx.stroke();
  }
  
  // Name
  ctx.fillStyle='#555';
  ctx.font='6px "Noto Sans SC"';
  ctx.textAlign='center';
  ctx.fillText(c.name,cx,cy+5);
  ctx.textAlign='start';
  ctx.restore();
}

function drawScene(){
  rect(0,0,W,120,P.wall);
  rect(0,118,W,4,P.wallTrim);
  rect(0,122,W,H-122,P.floor);
  // Rug
  rect(60,240,230,42,P.rug);
  rect(63,243,224,36,P.rugAccent);
  rect(66,246,218,30,P.rug);
  
  // Side table with lamp
  rect(295,200,30,18,P.woodLt);
  rect(298,218,3,14,P.woodDk);
  rect(305,218,3,14,P.woodDk);
  rect(305,192,14,10,P.gold); // lamp
  
  // Plant
  rect(12,205,12,10,'#BC6C25');
  rect(14,195,5,11,P.green);
  rect(19,198,4,8,P.greenLt);
  
  // Characters in semi-circle
  const positions=[
    {x:90,y:250},{x:170,y:245},{x:175,y:250},{x:250,y:248},{x:260,y:250}
  ];
  charColors.forEach((c,i)=>{
    const p=positions[i];
    drawChar(p.x,p.y,c,i,i===activeSpeaker);
  });
}

function resizeCanvas(){
  const area=document.getElementById('scene-area');
  canvas.width=W; canvas.height=H;
  const s=Math.min(area.clientWidth/W, area.clientHeight/H);
  canvas.style.width=(W*s)+'px';
  canvas.style.height=(H*s)+'px';
}
window.addEventListener('resize',resizeCanvas); resizeCanvas();

// ═══════════════ Chat Logic ═══════════════
const params=new URLSearchParams(window.location.search);
const topicTitle=params.get('topic')||'知识讨论';
document.getElementById('topic-title-display').textContent='💬 '+topicTitle;

const chatEl=document.getElementById('chat-messages');
const typingEl=document.getElementById('typing-indicator');
const inputEl=document.getElementById('msg-input');

function now(){const d=new Date();return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}

function addMsg(name,text,isSelf=false){
  const div=document.createElement('div');
  div.className='msg '+(isSelf?'self':'other');
  div.innerHTML=`
    <div class="name">${isSelf?'你':name}</div>
    <div class="bubble">${text}</div>
    <div class="time">${now()}</div>
  `;
  chatEl.appendChild(div);
  chatEl.scrollTop=chatEl.scrollHeight;
}

// Seed messages
const seed=[
  {name:'阿哲',text:'我觉得关键还是底层玩法要够好，抽签只是放大器，不能指望它救一个本身不好玩的玩法。'},
  {name:'小棠',text:'同意。之前我们项目踩过坑，加了一堆随机BUFF玩家完全不买账，数据跟老玩法差不多。'},
  {name:'青叶',text:'但PVE里面可以放开手脚做——漫威争锋在PVE里直接放大数字体验，玩家爽就完事了。'},
  {name:'言午',text:'角色适配这块工作量真的很容易爆炸。漫威每个英雄都得单独设计，我们后来搞了通用流派才解决。'},
  {name:'蓝山',text:'对，通用流派反而成了玩家讨论的热点话题，意外收获。这个经验值得参考。'},
];

// Auto-play seed messages one by one
let seedIdx=0;
function playSeed(){
  if(seedIdx>=seed.length) return;
  const s=seed[seedIdx];
  addMsg(s.name,s.text);
  activeSpeaker=seedIdx;
  seedIdx++;
  if(seedIdx<seed.length) setTimeout(playSeed,1800+Math.random()*1200);
  else setTimeout(()=>{activeSpeaker=-1;},1500);
}
setTimeout(playSeed,600);

// Send
function sendMsg(){
  const text=inputEl.value.trim();
  if(!text) return;
  inputEl.value='';
  addMsg('',text,true);
  activeSpeaker=-1;
  
  // AI response
  typingEl.textContent='对方正在输入…';
  const responders=charColors.map(c=>c.name);
  const r=responders[Math.floor(Math.random()*responders.length)];
  const ri=charColors.findIndex(c=>c.name===r);
  
  const replies=[
    '这个角度很有意思，能展开说说具体的案例吗？',
    '确实，我们之前也遇到过类似的情况，后来是这样处理的…',
    '我觉得可以从另一个方向来看这个问题——',
    '有道理！不过实操层面可能有些挑战需要克服。',
    '同意这个判断，跟实际项目里的经验很吻合。',
    '这一点很重要，很多团队都忽视了。',
  ];
  
  setTimeout(()=>{
    typingEl.textContent='';
    addMsg(r,replies[Math.floor(Math.random()*replies.length)]);
    activeSpeaker=ri;
    setTimeout(()=>{activeSpeaker=-1;},2500);
  },1000+Math.random()*1500);
}

inputEl.addEventListener('keydown',e=>{if(e.key==='Enter') sendMsg();});

// ═══════════════ Animate ═══════════════
function tick(){
  frame++;
  drawScene();
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
