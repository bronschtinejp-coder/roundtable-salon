<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回响圆桌 · 讨论中</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#E8F0F8;font-family:'Microsoft YaHei','微软雅黑',sans-serif;overflow:hidden;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  #container{width:100vw;height:100vh;max-width:1280px;max-height:720px;aspect-ratio:16/9;display:flex;border:2px solid #C8D0D8;box-shadow:0 4px 24px rgba(0,40,80,0.1)}
  /* Left: scene */
  #scene{flex:0 0 30%;position:relative;background:#F0F4F8}
  #c{position:absolute;top:0;left:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
  #back{position:absolute;top:8px;left:8px;z-index:5;background:#3E2210;border:2px solid #E8B830;color:#F5E6C8;font-size:10px;font-weight:700;padding:4px 10px;cursor:pointer;transition:all 0.15s}
  #back:hover{background:#E8B830;color:#2A1808;border-color:#FFD84D}
  /* Character profile popup */
  #char-profile{
    display:none;position:absolute;bottom:12px;left:12px;right:12px;z-index:6;
    background:#F5E6C8;border:2px solid #E8B830;padding:10px 12px;font-size:10px;
    line-height:1.6;color:#2A1808;animation:fIn .2s ease;
  }
  #char-profile.show{display:block}
  #char-profile .cp-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  #char-profile .cp-name{font-weight:700;font-size:12px;color:#2A1808}
  #char-profile .cp-close{cursor:pointer;font-size:12px;color:#8B6B4A}
  #char-profile .cp-close:hover{color:#E8B830}
  #char-profile .cp-tag{display:inline-block;background:#2B5E3A;color:#FFF;font-size:9px;padding:1px 6px;margin-right:4px;font-weight:700}
  #char-profile .cp-stat{font-size:9px;color:#8B6B4A;margin-top:4px}
  /* Right: chat panel */
  #chat{flex:1;display:flex;flex-direction:column;background:#F5E6C8;border-left:4px solid #3E2210;font-size:13px;position:relative;overflow:hidden}
  #chat-hdr{padding:12px 16px;font-weight:700;color:#2A1808;border-bottom:3px solid #8B6B4A;text-align:center;font-size:14px;letter-spacing:2px;flex-shrink:0;background:#E8D5B0;position:relative;z-index:2}
  #msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth;position:relative;z-index:1}
  #msgs::-webkit-scrollbar{width:8px}
  #msgs::-webkit-scrollbar-track{background:#E8D5B0}
  #msgs::-webkit-scrollbar-thumb{background:#8B6B4A;border-radius:4px}
  .msg{display:flex;flex-direction:column;max-width:88%;animation:fIn .3s ease}
  .msg.self{align-self:flex-end}.msg.other{align-self:flex-start}
  .msg .nm{font-size:11px;font-weight:700;margin-bottom:3px;padding:0 6px;letter-spacing:1px}
  .msg.self .nm{text-align:right;color:#8B2020}.msg.other .nm{color:#264653}
  .msg .bb{padding:9px 12px;font-size:12px;line-height:1.6;word-break:break-word;border:2px solid;position:relative}
  .msg.self .bb{background:#3E2210;color:#F5E6C8;border-color:#6B4226;border-radius:2px 2px 0 2px}
  .msg.other .bb{background:#FFFDF5;color:#2A1808;border-color:#C8B090;border-radius:2px 2px 2px 0;box-shadow:1px 1px 0 rgba(139,107,74,0.15)}
  .msg .tm{font-size:9px;color:#8B6B4A;margin-top:3px;padding:0 6px}
  .msg.self .tm{text-align:right}
  .msg.other .nm::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle;border:1px solid rgba(0,0,0,0.2)}
  .msg.other[data-char="\u963F\u54F2"] .nm::before{background:#264653}
  .msg.other[data-char="\u5C0F\u68E0"] .nm::before{background:#C84040}
  .msg.other[data-char="\u9752\u53F6"] .nm::before{background:#2B5E3A}
  .msg.other[data-char="\u8A00\u5348"] .nm::before{background:#E8B830}
  .msg.other[data-char="\u84DD\u5C71"] .nm::before{background:#4A7BA8}
  @keyframes fIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  #typing{padding:5px 14px 8px;font-size:11px;color:#8B6B4A;font-style:italic;min-height:22px;flex-shrink:0;position:relative;z-index:1}
  #inp-wrap{padding:12px 14px;border-top:3px solid #8B6B4A;display:flex;gap:8px;flex-shrink:0;background:#E8D5B0;position:relative;z-index:2}
  #inp-wrap input{flex:1;border:2px solid #8B6B4A;padding:9px 12px;font-family:'Microsoft YaHei',sans-serif;font-size:13px;background:#FFFDF5;color:#2A1808;outline:none;transition:border-color 0.2s;display:none}
  #inp-wrap #mi-rich{
    flex:1;border:2px solid #8B6B4A;padding:8px 12px;font-family:'Microsoft YaHei',sans-serif;font-size:12px;
    background:#FFFDF5;color:#2A1808;outline:none;transition:border-color 0.2s;
    min-height:52px;max-height:120px;overflow-y:auto;line-height:1.6;
    white-space:pre-wrap;word-break:break-word;
  }
  #inp-wrap #mi-rich:focus{border-color:#E8B830;box-shadow:0 0 0 1px #E8B830}
  #inp-wrap #mi-rich:empty::before{content:attr(data-placeholder);color:#B8A080;pointer-events:none}
  #inp-wrap #mi-rich .first-line{font-weight:700;font-size:13px}
  #inp-wrap button{border:2px solid #3E2210;background:#3E2210;color:#F5E6C8;font-family:'Microsoft YaHei',sans-serif;font-size:12px;font-weight:700;padding:9px 18px;cursor:pointer;letter-spacing:2px;white-space:nowrap;transition:all 0.15s}
  #inp-wrap button:hover{background:#E8B830;color:#2A1808;border-color:#E8B830}
  #ai-assist-btn{padding:9px 10px !important;letter-spacing:0 !important;font-size:14px !important;background:#E8D5B0 !important;border-color:#E8B830 !important;color:#B8901E !important}
  #ai-assist-btn:hover{background:#E8B830 !important;color:#2A1808 !important}
  #ai-assist-btn.active{background:#E8B830 !important;color:#2A1808 !important;box-shadow:0 0 6px rgba(232,184,48,0.4)}
  #invite-btn{padding:9px 10px !important;letter-spacing:0 !important;font-size:13px !important;font-weight:700 !important;background:#E0F0FF !important;border-color:#4A8BC8 !important;color:#4A8BC8 !important}
  #invite-btn:hover{background:#4A8BC8 !important;color:#FFF !important}
  .invite-item{padding:6px 8px;cursor:pointer;font-size:11px;display:flex;align-items:center;gap:6px;border-radius:2px;margin:2px 0}
  .invite-item:hover{background:#F0F7FF}
  .invite-item .inv-dot{width:8px;height:8px;border-radius:50%}
  .invite-item .inv-name{font-weight:700;color:#2D3748}

  /* ═══ AI Material Sidebar ═══ */
  #ai-sidebar{
    position:absolute;top:0;left:0;right:0;bottom:0;z-index:10;
    background:rgba(42,24,8,0.5);display:none;flex-direction:column;justify-content:flex-end;
  }
  #ai-sidebar.show{display:flex}
  #ai-panel{
    background:#F5E6C8;border-top:3px solid #E8B830;max-height:60%;overflow-y:auto;
    padding:0;animation:slideUp .25s ease;
  }
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  #ai-panel-hdr{
    padding:10px 14px;background:#3E2210;color:#E8B830;font-size:12px;font-weight:700;
    display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1;
  }
  #ai-panel-hdr span{cursor:pointer;font-size:14px;padding:0 4px}
  #ai-panel-hdr span:hover{color:#FFD84D}
  .ai-card{
    margin:10px 12px;padding:10px 12px;background:#FFFDF5;border:1px solid #C8B090;
    border-left:3px solid #E8B830;font-size:11px;line-height:1.6;color:#2A1808;
  }
  .ai-card .ai-src{font-size:9px;color:#8B6B4A;margin-top:6px}
  .ai-card .ai-tag{display:inline-block;background:#E8B830;color:#2A1808;font-size:9px;padding:1px 6px;margin-right:4px;font-weight:700}
  .ai-card .ai-title{font-weight:700;font-size:12px;margin-bottom:6px;color:#2A1808}
  .ai-card .ai-summary{margin-bottom:6px}
  .ai-card .ai-points{margin:6px 0;padding-left:14px}
  .ai-card .ai-points li{margin-bottom:3px;font-size:10px;line-height:1.5}
  .ai-card .ai-quote{font-size:10px;color:#5C4033;border-left:2px solid #C8B090;padding-left:8px;margin:6px 0;font-style:italic}
  .ai-card .ai-data{display:inline-block;background:#2B5E3A;color:#FFF;font-size:9px;padding:1px 6px;margin-top:4px;font-weight:700;border-radius:1px}
  .ai-card .ai-relevance{font-size:9px;color:#2B5E3A;font-weight:700;margin-top:4px}
  .ai-card .ai-use-btn{
    display:inline-block;margin-top:6px;padding:3px 10px;font-size:10px;font-weight:700;
    background:#E8D5B0;border:1px solid #B8901E;color:#2A1808;cursor:pointer;
    font-family:'Microsoft YaHei',sans-serif;transition:all 0.15s;
  }
  .ai-card .ai-use-btn:hover{background:#E8B830;border-color:#E8B830}
  .ai-card.editing{background:#FFF;border-color:#E8B830;border-width:2px}
  .ai-card.editing .ai-card-view{display:none}
  .ai-card.editing .ai-card-edit{display:block}
  .ai-card .ai-card-edit{display:none}
  .ai-card .ai-card-edit .edit-area{
    width:100%;min-height:120px;max-height:240px;overflow-y:auto;margin:6px 0;padding:8px;
    border:1px solid #C8B090;background:#FFFDF5;
    font-family:'Microsoft YaHei',sans-serif;font-size:11px;
    line-height:1.7;color:#2A1808;outline:none;resize:vertical;
    white-space:pre-wrap;word-break:break-word;
  }
  .ai-card .ai-card-edit .edit-area:focus{border-color:#E8B830}
  .ai-card .ai-card-edit .edit-area .edit-title{font-size:13px;font-weight:700;color:#2A1808;margin-bottom:4px}
  .ai-card .ai-card-edit .edit-area .edit-original{color:#999;font-size:11px}
  .ai-card .ai-card-edit .edit-area .edit-original em{font-style:italic}
  .ai-card .ai-card-edit .edit-area .edit-cursor{color:#2A1808;font-size:11px}
  .ai-card .ai-card-edit .edit-hint{font-size:9px;color:#8B6B4A;margin-bottom:4px}
  .ai-card .ai-card-edit .edit-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:4px}
  .ai-card .ai-card-edit .edit-actions button{
    padding:4px 12px;font-size:10px;font-weight:700;cursor:pointer;
    font-family:'Microsoft YaHei',sans-serif;border:1px solid;transition:all 0.15s;
  }
  .ai-card .ai-card-edit .edit-cancel{background:#E8D5B0;border-color:#8B6B4A;color:#2A1808}
  .ai-card .ai-card-edit .edit-cancel:hover{background:#C8B090}
  .ai-card .ai-card-edit .edit-send{background:#E8B830;border-color:#E8B830;color:#2A1808}
  .ai-card .ai-card-edit .edit-send:hover{background:#FFD84D}

  /* ═══ AI Writing Assistant Panel ═══ */
  #ai-suggest{
    display:none;position:absolute;bottom:68px;left:14px;right:14px;z-index:15;
    background:#FFFDF5;border:2px solid #E8B830;padding:0;font-size:11px;
    line-height:1.5;color:#2A1808;box-shadow:0 -2px 8px rgba(0,0,0,0.12);
    animation:fIn .2s ease;max-height:55vh;overflow-y:auto;
  }
  #ai-suggest::-webkit-scrollbar{width:6px}
  #ai-suggest::-webkit-scrollbar-thumb{background:#C8B090;border-radius:3px}
  .ai-sug-hdr{font-weight:700;color:#E8B830;font-size:10px;padding:8px 12px;background:#3E2210;position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center}
  .ai-sug-hdr span{cursor:pointer;font-size:12px;padding:0 2px}
  .ai-sug-hdr span:hover{color:#FFD84D}
  .ai-sug-section{padding:8px 12px;border-bottom:1px solid #E8D5B0}
  .ai-sug-section:last-child{border-bottom:none}
  .ai-sug-section .section-title{font-weight:700;font-size:10px;color:#B8901E;margin-bottom:4px}
  .ai-sug-section ul{margin:4px 0;padding-left:16px}
  .ai-sug-section li{margin-bottom:3px;font-size:11px;line-height:1.5}
  .ai-sug-section li.kb{color:#2B5E3A;font-weight:700}
  .ai-sug-section .struct-box{background:#F0E8D0;border:1px solid #D8C8A0;padding:8px 10px;margin-top:4px;font-size:10px;line-height:1.7}
  .ai-sug-section .struct-box .struct-label{font-weight:700;color:#5C4033}
  .ai-sug-section .struct-box .struct-point{color:#264653;margin-left:8px}
  .ai-sug-section .struct-box .struct-data{color:#2B5E3A;font-weight:700;font-size:9px;margin-left:8px}
  .ai-sug-actions{padding:8px 12px;display:flex;gap:6px;justify-content:flex-end;border-top:1px solid #E8D5B0}
  .ai-sug-actions button{
    font-size:10px;padding:4px 10px;border:1px solid #8B6B4A;background:#E8D5B0;color:#2A1808;
    cursor:pointer;font-family:'Microsoft YaHei',sans-serif;font-weight:700;
  }
  .ai-sug-actions button.primary{background:#E8B830;border-color:#E8B830}
  .ai-sug-actions button:hover{opacity:0.85}

  /* ═══ AI Fallback Message ═══ */
  .msg.ai-fallback{align-self:stretch;max-width:100%}
  .msg.ai-fallback .nm{color:#B8901E}
  .msg.ai-fallback .nm::before{background:#E8B830 !important}
  .msg.ai-fallback .bb{
    background:#FFFDF5;color:#2A1808;border:2px dashed #E8B830;border-radius:2px;
    font-size:11px;padding:8px 12px;
  }
  .msg.ai-fallback .fb-hdr{font-weight:700;color:#B8901E;font-size:11px;margin-bottom:6px;display:flex;align-items:center;gap:4px}
  .msg.ai-fallback .fb-toggle{
    font-size:10px;color:#8B6B4A;cursor:pointer;margin-top:6px;text-decoration:underline;
  }
  .msg.ai-fallback .fb-toggle:hover{color:#E8B830}
  .msg.ai-fallback .fb-body{margin-top:6px}
  .msg.ai-fallback.collapsed .fb-body{display:none}
  .msg.ai-fallback .fb-item{
    margin-bottom:6px;cursor:pointer;padding:4px 6px;border-radius:2px;transition:background 0.15s;
  }
  .msg.ai-fallback .fb-item:hover{background:rgba(232,184,48,0.1)}
  .msg.ai-fallback .fb-item strong{color:#B8901E;border-bottom:1px dashed #B8901E}
  .msg.ai-fallback .fb-item .fb-peek{font-size:10px;color:#5C4033;margin-top:2px}
  .msg.ai-fallback .fb-detail{
    display:none;margin:6px 0 10px;padding:10px 12px;background:#FFF;
    border:1px solid #E8B830;border-left:3px solid #E8B830;font-size:11px;line-height:1.6;
    animation:fIn .2s ease;
  }
  .msg.ai-fallback .fb-detail.show{display:block}
  .msg.ai-fallback .fb-detail .fd-title{font-weight:700;font-size:12px;color:#2A1808;margin-bottom:6px}
  .msg.ai-fallback .fb-detail .fd-tag{display:inline-block;background:#E8B830;color:#2A1808;font-size:9px;padding:1px 6px;margin-right:4px;font-weight:700}
  .msg.ai-fallback .fb-detail .fd-points{margin:6px 0;padding-left:14px}
  .msg.ai-fallback .fb-detail .fd-points li{margin-bottom:3px;font-size:10px}
  .msg.ai-fallback .fb-detail .fd-quote{font-size:10px;color:#5C4033;border-left:2px solid #C8B090;padding-left:8px;margin:6px 0;font-style:italic}
  .msg.ai-fallback .fb-detail .fd-data{display:inline-block;background:#2B5E3A;color:#FFF;font-size:9px;padding:1px 6px;margin-top:4px;font-weight:700}
  .msg.ai-fallback .fb-detail .fd-src{font-size:9px;color:#8B6B4A;margin-top:6px}
  .msg.ai-fallback .fb-detail .fd-close{font-size:10px;color:#8B6B4A;cursor:pointer;text-decoration:underline;margin-top:6px;display:inline-block}
  .msg.ai-fallback .fb-detail .fd-close:hover{color:#E8B830}

  /* ═══ Insight Card ═══ */
  #insight-card{
    display:none;margin:12px;padding:0;border:2px solid #E8B830;background:#FFFDF5;
    animation:fIn .4s ease;
  }
  #insight-card.show{display:block}
  #insight-hdr{
    padding:8px 12px;background:#3E2210;color:#E8B830;font-size:12px;font-weight:700;
    display:flex;align-items:center;gap:6px;
  }
  #insight-body{padding:10px 12px;font-size:11px;line-height:1.7;color:#2A1808}
  #insight-body .ins-section{margin-bottom:8px}
  #insight-body .ins-label{font-weight:700;color:#2B5E3A;font-size:10px;margin-bottom:2px}
  #insight-body .ins-people{font-size:9px;color:#8B6B4A;margin-top:8px;padding-top:6px;border-top:1px solid #E8D5B0}

  /* ═══ AI Proactive Question ═══ */
  .msg.ai-question{align-self:stretch;max-width:100%}
  .msg.ai-question .nm{color:#B8901E}
  .msg.ai-question .nm::before{background:#E8B830 !important}
  .msg.ai-question .bb{
    background:#FFFDF5;color:#2A1808;border:2px solid #E8B830;border-radius:2px;
    font-size:12px;padding:10px 12px;line-height:1.6;
  }
  .msg.ai-question .aq-label{font-size:9px;color:#B8901E;font-weight:700;margin-bottom:4px}
  .msg.ai-question .aq-context{font-size:9px;color:#8B6B4A;margin-top:6px;font-style:italic}
</style>
</head>
<body>
<div id="container">
<div id="scene">
  <canvas id="c"></canvas>
  <button id="back" onclick="window.location.href='pixel-salon-v19.html'">← 返回沙龙</button>
  <div id="char-profile">
    <div class="cp-hdr">
      <span class="cp-name" id="cp-name"></span>
      <span class="cp-close" onclick="closeProfile()">✕</span>
    </div>
    <div id="cp-body"></div>
  </div>
</div>
<div id="chat">
  <div id="chat-hdr">讨论中</div>
  <div id="msgs"></div>
  <div id="typing"></div>

  <!-- AI Material Sidebar (overlays chat area) -->
  <div id="ai-sidebar">
    <div id="ai-panel">
      <div id="ai-panel-hdr">
        <div>💡 AI 素材参考 · 点击卡片可引用编辑</div>
        <span id="ai-close" title="关闭">✕</span>
      </div>
      <div id="ai-materials"></div>
    </div>
  </div>

  <!-- AI Writing Assistant Panel -->
  <div id="ai-suggest">
    <div id="ai-sug-text"></div>
  </div>

  <div id="inp-wrap">
    <div id="mi-rich" contenteditable="true" data-placeholder="第一行为观点标题（加粗），Shift+Enter换行写正文，Enter发送"></div>
    <button id="ai-assist-btn" onclick="toggleAISuggest()" title="AI 写作助手">💡</button>
    <button id="invite-btn" onclick="toggleInvitePanel()" title="邀请同事参与">@</button>
    <button onclick="send()">发 言</button>
  </div>

  <!-- Invite Panel -->
  <div id="invite-panel" style="display:none;position:absolute;bottom:72px;right:14px;z-index:16;background:#FFF;border:1px solid #C8D0D8;padding:0;width:200px;box-shadow:0 2px 8px rgba(0,40,80,0.1);animation:fIn .2s ease;border-radius:3px">
    <div style="padding:8px 10px;background:#4A7BA8;color:#FFF;font-size:11px;font-weight:700;display:flex;justify-content:space-between;align-items:center;border-radius:3px 3px 0 0">
      <span>@ 邀请同事参与</span><span style="cursor:pointer" onclick="toggleInvitePanel()">✕</span>
    </div>
    <div id="invite-list" style="padding:6px"></div>
  </div>

  <!-- Insight Card (appended at bottom of chat) -->
  <div id="insight-card">
    <div id="insight-hdr">📋 设计洞察卡 · AI整理</div>
    <div id="insight-body"></div>
  </div>
</div>
</div>

<script>
// ═══════════════════════════════════════
//  Canvas Scene (same as v4, compact)
// ═══════════════════════════════════════
const W=384,H=720,ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;
function sz(){const s=Math.min(scene.clientWidth/W,scene.clientHeight/H);c.width=W;c.height=H;c.style.width=(W*s)+'px';c.style.height=(H*s)+'px'}
window.addEventListener('resize',sz);sz();
function R(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x|0,y|0,w|0,h|0)}
const imgCache={};
function loadImg(key,src){const im=new Image();im.src=src;imgCache[key]=im;return im}
const SPR={
  chars:['azhe','xiaotang','qingye','yanwu','lanshan'].map(n=>loadImg('char_'+n,'sprites/char_'+n+'.png')),
  workstation:loadImg('workstation2','sprites/workstation2.png'),
  programmer:loadImg('programmer','sprites/programmer_desk.png'),
  artist:loadImg('artist','sprites/artist_desk.png'),
  bookcase:loadImg('bookcase','sprites/bookcase.png'),

// ═══ Anime-style Lightbulb Indicator ═══
// Lifecycle: pop-in (10 frames) → glow (150 frames ~2.5s) → fade-out (30 frames)
let bulbState='idle',bulbTimer=0,bulbCharIdx=-1,lastActive=-1;
const BULB_POPIN=10,BULB_HOLD=150,BULB_FADEOUT=30;

function drawBulbIndicator(f){
  // Detect active change → trigger new bulb
  if(active!==lastActive){
    lastActive=active;
    if(active>=0){bulbState='popin';bulbTimer=0;bulbCharIdx=active}
  }
  if(bulbState==='idle'||bulbCharIdx<0)return;
  
  bulbTimer++;
  let alpha=1,scale=1;
  
  if(bulbState==='popin'){
    // Bounce-in: overshoot then settle
    const t=bulbTimer/BULB_POPIN;
    scale=t<0.6?t*1.8:1.2-((t-0.6)/0.4)*0.2; // overshoot to 1.2 then back to 1.0
    alpha=t;
    if(bulbTimer>=BULB_POPIN){bulbState='hold';bulbTimer=0}
  }else if(bulbState==='hold'){
    scale=1;alpha=1;
    if(bulbTimer>=BULB_HOLD){bulbState='fadeout';bulbTimer=0}
  }else if(bulbState==='fadeout'){
    scale=1-bulbTimer/BULB_FADEOUT*0.3;
    alpha=1-bulbTimer/BULB_FADEOUT;
    if(bulbTimer>=BULB_FADEOUT){bulbState='idle';return}
  }
  
  const pos=[{x:60,y:470},{x:130,y:450},{x:192,y:460},{x:254,y:450},{x:324,y:470}];
  const bx=pos[bulbCharIdx].x,by=pos[bulbCharIdx].y-30;
  
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.translate(bx,by);
  ctx.scale(scale,scale);
  
  // Lightbulb (16x22 pixels, drawn centered at 0,0)
  const gold=P.gold,goldL='#FFD84D',goldD='#B8901E',white='#FFFDE0';
  // Bulb glass
  R(-5,-11,10,4,goldL);    // top curve
  R(-7,-7,14,8,goldL);     // main bulb
  R(-6,-9,12,2,white);     // highlight
  // Inner glow pulse
  const innerGlow=0.4+Math.sin(f*0.1)*0.15;
  R(-4,-7,8,5,`rgba(255,255,220,${innerGlow})`);
  // Base/screw
  R(-4,1,8,3,goldD);
  R(-3,4,6,2,'#8B6B14');
  R(-4,6,8,3,goldD);
  
  // Pop-in radiating lines (only during popin + first 20 frames of hold)
  if(bulbState==='popin'||(bulbState==='hold'&&bulbTimer<20)){
    const lineAlpha=bulbState==='popin'?alpha:1-bulbTimer/20;
    ctx.strokeStyle=`rgba(255,216,77,${lineAlpha*0.8})`;
    ctx.lineWidth=2;
    const rays=6;
    for(let r=0;r<rays;r++){
      const angle=(r/rays)*Math.PI*2-Math.PI/2;
      const inner=12,outer=18+Math.sin(f*0.2+r)*2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(angle)*inner,Math.sin(angle)*inner-4);
      ctx.lineTo(Math.cos(angle)*outer,Math.sin(angle)*outer-4);
      ctx.stroke();
    }
  }
  
  ctx.restore();
}

let sugVisible=false;

function analyzeInput(text){
  const t=text.trim();
  // Section 1: Writing tips
  const tips=[];
  if(!t){
    tips.push('补充你的项目背景或具体场景，其他人更容易给出针对性建议');
    tips.push('如果是提问，描述你目前尝试过的方案和遇到的问题');
    tips.push('如果是观点，附上支撑的数据或案例会更有说服力');
  } else {
    if(t.length<15) tips.push('当前内容较短，补充具体场景或案例会让讨论更聚焦');
    if(!t.match(/[。！？，、]/)) tips.push('可以分点阐述，让观点结构更清晰');
    if(t.match(/怎么|如何|咋/)) tips.push('提问时补充品类、目标用户、当前阶段等上下文');
    if(t.match(/好不好|行不行|能不能/)) tips.push('拆解为具体维度（留存、付费、体验），讨论更深入');
    if(t.match(/为什么|为啥/)) tips.push('附上你观察到的具体现象或数据');
    if(t.match(/我觉得|我认为|个人感觉/)) tips.push('补充支撑的案例或数据会更有说服力');
    if(t.match(/不同意|反对|但是/)) tips.push('说明基于什么经验得出的不同结论，比单纯否定更有建设性');
    if(tips.length===0) tips.push('当前内容表述清晰，可以直接发送');
  }

  // Section 2: Structure scaffold + supporting data
  let scaffold=null;
  if(t.length>=4){
    scaffold={thesis:'',angles:[],data:[]};
    // Extract thesis
    if(t.match(/我觉得|我认为|个人感觉/)){
      scaffold.thesis=t.replace(/^.*(我觉得|我认为|个人感觉)/,'').slice(0,30);
    } else if(t.length>=6){
      scaffold.thesis=t.slice(0,30)+(t.length>30?'…':'');
    }
    // Suggest expansion angles based on content
    if(t.match(/通用流派|流派/)){
      scaffold.angles=['工作量对比：专属 vs 通用的人力成本差异','玩家反馈：社区讨论活跃度和UGC产出变化','适用场景：什么品类/阶段适合通用流派'];
      scaffold.data=['通用流派工作量: 0.5人周/角色 vs 专属: 3人周/角色','《星渊纪元》切换后社区讨论量 +40%'];
    } else if(t.match(/数值|PVE|爽感/)){
      scaffold.angles=['数值策略：放大倍率的合理区间','体验验证：玩家爽感评分的变化','风险控制：对PVP平衡和长期留存的影响'];
      scaffold.data=['《星渊纪元》PVE爽感评分: 3.2→4.6','7日留存 +12% / 首月付费 +18%'];
    } else if(t.match(/随机|抽签|Roguelike|rogue/i)){
      scaffold.angles=['前提条件：底层玩法质量的要求','应用场景：PVE vs PVP的策略差异','设计边界：随机性的"可控度"和"影响范围"'];
      scaffold.data=['38%头部产品尝试Roguelike融合，留存显著提升仅12%','成功案例共性：随机性限定在"构建"阶段'];
    } else if(t.match(/角色|适配|工作量/)){
      scaffold.angles=['量产效率：不同方案的人力投入对比','质量把控：如何在效率和精度间取舍','玩家感知：玩家真的需要角色专属设计吗'];
      scaffold.data=['40角色专属→120人周 vs 通用流派→20人周'];
    } else {
      scaffold.angles=['支撑案例：有没有类似的项目经验','数据验证：能否量化这个判断','适用边界：什么情况下这个观点成立/不成立'];
      scaffold.data=[];
    }
  }

  // Section 3: KB hints
  const kbHints=[];
  if(t.match(/随机|抽签|Roguelike|rogue/i)) kbHints.push('有3条关于"抽签玩法"的过往讨论');
  if(t.match(/数值|爽感|PVE/i)) kbHints.push('项目B"PVE数值放大"复盘数据');
  if(t.match(/流派|角色|适配/)) kbHints.push('言午的通用流派实践经验');
  if(t.match(/留存|付费|商业化/)) kbHints.push('行业Roguelike融合品类趋势报告');

  return {tips,scaffold,kbHints};
}

function buildSuggestHTML(result){
  let html=`<div class="ai-sug-hdr"><span>💡 AI 写作助手</span><span onclick="toggleAISuggest()">✕</span></div>`;

  // Section 1: Tips
  html+='<div class="ai-sug-section"><div class="section-title">📝 写作建议</div><ul>';
  result.tips.forEach(t=>html+=`<li>${t}</li>`);
  html+='</ul></div>';

  // Section 2: Structure scaffold
  if(result.scaffold){
    html+='<div class="ai-sug-section"><div class="section-title">🏗️ 结构化辅助 · 展开框架</div>';
    html+='<div class="struct-box">';
    if(result.scaffold.thesis) html+=`<div><span class="struct-label">核心论点：</span>${result.scaffold.thesis}</div>`;
    html+='<div style="margin-top:4px"><span class="struct-label">建议展开角度：</span></div>';
    result.scaffold.angles.forEach((a,i)=>html+=`<div class="struct-point">  ${i+1}. ${a}</div>`);
    if(result.scaffold.data.length>0){
      html+='<div style="margin-top:4px"><span class="struct-label">可引用数据：</span></div>';
      result.scaffold.data.forEach(d=>html+=`<div class="struct-data">  📊 ${d}</div>`);
    }
    html+='</div></div>';
  }

  // Section 3: KB links
  if(result.kbHints.length>0){
    html+='<div class="ai-sug-section"><div class="section-title">📚 知识库关联</div><ul>';
    result.kbHints.forEach(h=>html+=`<li class="kb">${h}</li>`);
    html+='</ul></div>';
  }

  // Actions
  html+='<div class="ai-sug-actions"><button onclick="openMaterialsFromBtn()">📎 查看完整素材</button></div>';
  return html;
}

function buildEditorHTML(m){
  let html='';
  // Title line: bold, larger, black
  html+=`<div class="edit-title">【${m.tag}】${m.title}</div>`;
  // Original content: gray
  html+=`<div class="edit-original">`;
  html+=m.summary+'<br>';
  if(m.points&&m.points.length){
    html+='<br>';
    html+=m.points.map((p,i)=>`${i+1}. ${p}`).join('<br>');
  }
  if(m.data) html+=`<br><br>📊 ${m.data}`;
  if(m.quote) html+=`<br><br><em>引用：${m.quote}</em>`;
  html+=`</div>`;
  // Cursor zone for new input
  html+=`<div class="edit-cursor"><br></div>`;
  return html;
}

function startEditCard(idx){
  // Close any other editing card
  document.querySelectorAll('.ai-card.editing').forEach(c=>c.classList.remove('editing'));
  const card=document.getElementById('ai-card-'+idx);
  card.classList.add('editing');
  const editArea=document.getElementById('ai-card-edit-'+idx);
  editArea.innerHTML=buildEditorHTML(aiMaterials[idx]);
  // Place cursor at the end (in the edit-cursor div)
  setTimeout(()=>{
    editArea.focus();
    const cursorDiv=editArea.querySelector('.edit-cursor');
    if(cursorDiv){
      const range=document.createRange();
      const sel=window.getSelection();
      range.selectNodeContents(cursorDiv);
      range.collapse(false);
      sel.removeAllRanges();
      sel.addRange(range);
    }
    card.scrollIntoView({behavior:'smooth',block:'center'});
  },100);
}

function cancelEditCard(idx){
  document.getElementById('ai-card-'+idx).classList.remove('editing');
}

function sendEditCard(idx){
  const editArea=document.getElementById('ai-card-edit-'+idx);
  const text=editArea.textContent.trim();
  if(!text)return;
  // Build formatted HTML for chat (same structure as edit, but all black)
  const m=aiMaterials[idx];
  let chatHTML=`<div style="font-size:13px;font-weight:700;margin-bottom:4px">【${m.tag}】${m.title}</div>`;

    chatHTML+='<div style="margin:4px 0">';

  if(m.quote) chatHTML+=`<div style="margin-top:4px;font-style:italic">引用：${m.quote}</div>`;

  const cursorDiv=editArea.querySelector('.edit-cursor');
  if(cursorDiv){

    if(userText) chatHTML+=`<div style="margin-top:6px;padding-top:6px;border-top:1px solid #E8D5B0">${userText}</div>`;

  document.getElementById('ai-card-'+idx).classList.remove('editing');

    fb.classList.add('collapsed');

  }
  if(fallbackTimer){clearTimeout(fallbackTimer);fallbackTimer=null}

  // Trigger NPC replies
  const pool=[...charColors];
  const replyCount=2+Math.floor(Math.random()*2);
  const picked=[];
  for(let i=0;i<replyCount&&pool.length>0;i++){
    const ix=Math.floor(Math.random()*pool.length);
    picked.push(pool.splice(ix,1)[0]);
  }
  let delay=1200+Math.random()*800;
  picked.forEach((ch,i)=>{
    const ri=charColors.findIndex(c=>c.name===ch.name);
    const styleMap2={'阿哲':['引用数据来讨论这个问题——这个思路很严谨，我补充一点我们项目的经验。','这些数据确实能说明问题，跟我们观察到的趋势一致。','从数据来看方向是对的，关键是怎么落地到具体设计里。'],'小棠':['有数据支撑就靠谱多了。我们项目也可以拉类似的数据对比一下。','这个引用很到位，补充一下我们的实际情况也差不多。','用数据说话比感觉准，我觉得可以基于这个方向继续深挖。'],'青叶':['这些案例很有参考价值，尤其是数值部分跟我了解的情况吻合。','引用得好！不过不同品类可能差异比较大，不能直接套用。','从体验角度看，这些数据背后反映的玩家心理很值得分析。'],'言午':['有据可依，这个讨论质量上来了。我回头也把我们的数据整理一下。','这个引用帮我回忆起之前踩过的坑，确实是这样的。','数据面很全，实操层面我再补充几个注意点。'],'蓝山':['这个角度的数据我之前没注意到，涨知识了。','行业数据和我们内部的表现大体一致，但细节上有些差异值得讨论。','能把数据来源发一下吗？我想看看原始报告里还有没有其他有用的信息。']};
    const pool3=styleMap2[ch.name]||['这个引用很有价值，值得深入讨论。'];
    const reply=pool3[Math.floor(Math.random()*pool3.length)];
    setTimeout(()=>{
      if(i===0)typing.textContent=ch.name+' 正在输入…';
      setTimeout(()=>{

}

    const reply=pool2[Math.floor(Math.random()*pool2.length)];
    setTimeout(()=>{
      if(i===0)typing.textContent=ch.name+' 正在输入…';
      setTimeout(()=>{
        typing.textContent='';
        addMsg(ch.name,reply);
        active=ri;msgCount++;
        checkInsightCard();
        // Queue next replier's typing indicator
        if(i<picked.length-1){
          setTimeout(()=>{typing.textContent=picked[i+1].name+' 正在输入…'},400);
        } else {
          setTimeout(()=>{active=-1;maybeAIQuestion()},2000);
        }
      },800+Math.random()*600);
    },delay*i);
  });
}

];

const charPositions=[{x:60,y:470},{x:130,y:450},{x:192,y:460},{x:254,y:450},{x:324,y:470}];

c.addEventListener('click',(e)=>{
  const r=c.getBoundingClientRect(),sx=W/r.width,sy=H/r.height;
  const mx=(e.clientX-r.left)*sx,my=(e.clientY-r.top)*sy;
  for(let i=charPositions.length-1;i>=0;i--){
    const cp=charPositions[i],dx=mx-cp.x,dy=my-(cp.y-30);
    if(dx*dx+dy*dy<35*35){showProfile(i);return}
  }
  closeProfile();
});

function showProfile(idx){
  const p=charProfiles[idx];
  document.getElementById('cp-name').textContent=p.name+' · '+p.role;
  let html='';
  html+=`<div style="margin-bottom:4px">`+p.expertise.map(e=>`<span class="cp-tag">${e}</span>`).join('')+'</div>';
  html+=`<div style="font-style:italic;color:#5C4033;margin:4px 0">"${p.quote}"</div>`;
  html+=`<div class="cp-stat">历史贡献: ${p.contributions}次讨论参与</div>`;
  document.getElementById('cp-body').innerHTML=html;
  document.getElementById('char-profile').classList.add('show');
}

function closeProfile(){
  document.getElementById('char-profile').classList.remove('show');
}

const inviteCandidates=[
  {name:'白露',role:'体验设计',color:'#DD7799'},
  {name:'阿哲',role:'系统策划',color:'#4488CC'},
  {name:'小棠',role:'关卡策划',color:'#DD5555'},
  {name:'青叶',role:'体验设计',color:'#55AA66'},
  {name:'言午',role:'技术策划',color:'#EE9933'},
  {name:'蓝山',role:'市场策划',color:'#8866AA'},
  {name:'老陈',role:'主程',color:'#666'},
  {name:'木鱼',role:'美术总监',color:'#CC7744'},
];
let inviteOpen=false;

function toggleInvitePanel(){
  inviteOpen=!inviteOpen;
  const panel=document.getElementById('invite-panel');
  if(inviteOpen){
    panel.style.display='block';
    const list=document.getElementById('invite-list');
    list.innerHTML='';
    inviteCandidates.forEach(c=>{
      const d=document.createElement('div');d.className='invite-item';
      d.innerHTML=`<span class="inv-dot" style="background:${c.color}"></span><span class="inv-name">${c.name}</span><span style="font-size:9px;color:#888">${c.role}</span>`;
      d.onclick=()=>sendInvite(c);
      list.appendChild(d);
    });
  }else{
    panel.style.display='none';
  }
}

function sendInvite(person){
  toggleInvitePanel();
  // Add system message to chat
  const d=document.createElement('div');
  d.className='msg other';d.setAttribute('data-char','系统');
  d.innerHTML=`<div class="nm" style="color:#4A8BC8">📩 邀请通知</div><div class="bb" style="background:#F0F7FF;border-color:#C8D8E8;font-size:11px">你邀请了 <strong>${person.name}</strong>（${person.role}）参与本次讨论。对方将在通知栏收到提醒。</div><div class="tm">${now()}</div>`;
  msgsEl.appendChild(d);msgsEl.scrollTop=msgsEl.scrollHeight;
}

function tick(){frame++;drawScene(frame);requestAnimationFrame(tick)}tick();
