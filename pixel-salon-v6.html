<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回响圆桌 · 知识沙龙</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@700;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#2A1E14;font-family:'Noto Sans SC',sans-serif;overflow:hidden;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  #container{position:relative;width:100vw;height:100vh;max-width:1280px;max-height:720px;aspect-ratio:16/9}
  #c{position:absolute;top:0;left:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
</style>
</head>
<body><div id="container"><canvas id="c"></canvas></div>

<script>
const W=640,H=360,ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;
function rz(){const ct=document.getElementById('container');const s=Math.min(ct.clientWidth/W,ct.clientHeight/H);c.width=W;c.height=H;c.style.width=(W*s)+'px';c.style.height=(H*s)+'px'}
window.addEventListener('resize',rz);rz();
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w|0,h|0)}
function L(x1,y1,x2,y2,c,w=1){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}

// ═══ Palette — warm spring morning ═══
const P={
  wall:'#FDF5E6',wain:'#F0E4CC',wainT:'#E0D0B0',base:'#D0BC98',
  floor:'#C89850',floorD:'#A87830',floorL:'#D8B870',
  stone:'#D4C4A0',stoneD:'#C4B090',stoneL:'#E4D8C0',
  rug:'#C05038',rugD:'#983020',rugG:'#E8B060',rugM:'#D87848',
  wd:'#5C3A1E',wdL:'#7A5230',wdD:'#3E2410',
  g1:'#2D6A4F',g2:'#40916C',g3:'#52B788',g4:'#74A85A',g5:'#95C86A',
  sakura:'#E8A0B8',sakuraD:'#C87090',sakuraL:'#F0C0D8',sakuraWood:'#8B6B4A',
  gold:'#D4A843',red:'#C84B31',navy:'#264653',ink:'#2D2D2D',
  sky:'#87CEEB',skyL:'#B8E4F0',grass:'#7CB342',hill:'#5D8A3C',
  cork:'#C49464',corkBg:'#EDE0C8',paper:'#FEFAE0',
  yellow:'#E8C040',yellowD:'#C8A020',
  sh:'rgba(0,0,0,0.05)',shD:'rgba(0,0,0,0.1)',
};

const topics=[
  {title:'抽签玩法融合的成与败',tag:'Roguelike'},
  {title:'社交系统设计的得与失',tag:'社交'},
  {title:'AI如何重塑关卡设计',tag:'AI+游戏'},
  {title:'叙事与机制的边界',tag:'叙事'},
  {title:'商业化体验平衡',tag:'商业化'},
  {title:'开放世界内容密度',tag:'关卡'},
];

/* ═══════════════════════════════════════════════
   LAYOUT inspired by farm plaza:
   ┌─────────────────────────────────────────────┐
   │ [Window]    [TITLE SIGN]    [HOT BOARD]    │ ← back wall
   │                                 [Clock]     │
   ├─────────────────────────────────────────────┤
   │  ╔══════════════════════════════════════╗   │
   │  ║         CENTRAL RUG (plaza)         ║   │
   │  ║      open discussion space          ║   │
   │  ╚══════════════════════════════════════╝   │
   │ [Sakura] [Round  [char] [BENCH   [Study  │
   │  tree]    Table]         SEATS]   corner] │
   │ [chest]  [stools]       [flowers]        │
   └─────────────────────────────────────────────┘
   ═══════════════════════════════════════════════ */

// ═══ ROOM ═══
function drawRoom(){
  // Wall
  R(0,0,W,112,P.wall);
  R(0,110,W,3,P.wainT);R(0,112,W,10,P.wain);R(0,120,W,4,P.base);
  
  // Floor (warm wood planks)
  R(0,124,W,H-124,P.floor);
  for(let y=124;y<H;y+=10)L(0,y,W,y,P.floorL,0.4);
  for(let row=0;row<25;row++){
    const y=124+row*10,off=(row&1)?0:W/2;
    for(let x=off;x<W;x+=85+Math.sin(row*1.9)*20)if(x<W)L(x,y,x,y+10,P.floorD,0.3);
  }
  
  // Central stone plaza rug (warm flagstones)
  const rx=140,ry=260,rw=360,rh=62;
  // Stone base
  R(rx,ry,rw,rh,P.stone);
  // Stone grid pattern
  for(let sx=rx;sx<rx+rw;sx+=28){
    for(let sy=ry;sy<ry+rh;sy+=14){
      const ox=(Math.floor((sy-ry)/14)%2)?14:0;
      R(sx+ox,sy,28,14,'');
      ctx.fillStyle=P.stoneD;ctx.strokeRect(sx+ox,sy,28,14);
    }
  }
  // Rug overlay on stones (softer center)
  R(rx+30,ry+6,rw-60,rh-12,P.rug);
  R(rx+34,ry+10,rw-68,rh-20,P.rugM);
  R(rx+38,ry+14,rw-76,rh-28,P.rugG);
  // Diamond accents
  for(let i=0;i<6;i++){
    const dx=rx+50+i*50,dy=ry+rh/2;
    R(dx-7,dy-3,14,6,P.rugD);
    R(dx-5,dy-1,10,4,P.rug);
  }
}

// ═══ TITLE SIGN — large carved wooden sign, top center ═══
function drawTitleSign(){
  const sx=220,sy=10,sw=200,sh=42;
  // Chains
  L(sx+12,0,sx+12,sy,P.wdD,2);L(sx+sw-12,0,sx+sw-12,sy,P.wdD,2);
  R(sx+8,0,8,5,P.gold);R(sx+sw-16,0,8,5,P.gold);
  // Board
  R(sx+3,sy+3,sw,sh,P.wdD);R(sx,sy,sw,sh,P.wd);
  R(sx+3,sy+3,sw-6,sh-6,P.wdL);
  R(sx+5,sy+4,sw-10,3,'rgba(255,255,255,0.12)');
  // Inner panel
  R(sx+10,sy+9,sw-20,sh-18,P.wdD);
  // Text
  ctx.fillStyle='#F4E8C8';ctx.font='bold 22px "Noto Sans SC"';ctx.textAlign='center';
  ctx.fillText('回 响 圆 桌',sx+sw/2,sy+32);
  ctx.fillStyle='rgba(244,232,200,0.65)';ctx.font='9px "Noto Sans SC"';
  ctx.fillText('知 识 沙 龙',sx+sw/2,sy+41);
  ctx.textAlign='start';
}

// ═══ WINDOW — left back wall, morning light ═══
function drawWindow(x,y){
  const w=46,h=40;
  R(x-3,y-3,w+6,h+6,P.wdD);R(x,y,w,h,P.wd);
  R(x+3,y+3,w-6,h-6,P.sky);R(x+3,y+3,w-6,10,P.skyL);
  R(x+3,y+h-18,w-6,6,P.hill);R(x+7,y+h-20,13,5,P.grass);R(x+27,y+h-17,17,5,P.grass);
  R(x+w/2-1,y,2,h,P.wdL);R(x,y+h/2-1,w,2,P.wdL);
  // Morning light beam
  ctx.fillStyle='rgba(255,248,220,0.09)';ctx.beginPath();
  ctx.moveTo(x+6,y+3);ctx.lineTo(x+w-6,y+3);ctx.lineTo(x+w+40,y+h+45);ctx.lineTo(x-40,y+h+45);ctx.fill();
}

// ═══ HOT TOPICS BOARD — right back wall ═══
function drawBoard(){
  const bx=504,by=14,bw=122,bh=98;
  R(bx-3,by-3,bw+6,bh+6,P.wdD);R(bx,by,bw,bh,P.cork);R(bx+3,by+3,bw-6,bh-6,P.corkBg);
  ctx.fillStyle=P.wdD;ctx.font='bold 8px "Noto Sans SC"';
  ctx.fillText('🔥 本周热点',bx+5,by+19);
  L(bx+4,by+23,bx+bw-4,by+23,P.cork,1);
  topics.forEach((t,i)=>{
    const ty=by+28+i*13;
    R(bx+5,ty+3,3,3,P.red);
    ctx.fillStyle=P.ink;ctx.font='bold 7px "Noto Sans SC"';
    ctx.fillText(t.title.length>9?t.title.slice(0,9)+'…':t.title,bx+11,ty+8);
    ctx.fillStyle=P.red;ctx.font='5.5px "Noto Sans SC"';
    ctx.fillText('#'+t.tag,bx+11,ty+12);
  });
}

// ═══ FURNITURE — organized around central plaza ═══

// SAKURA TREE — left focal point (like reference's cherry tree)
function drawSakura(x,y){
  // Trunk
  R(x+8,y-8,6,20,P.sakuraWood);R(x+7,y-12,8,20,P.sakuraWood);
  R(x+9,y-18,4,30,P.wdD); // darker core
  // Ground shadow
  ctx.fillStyle=P.shD;ctx.beginPath();ctx.ellipse(x+11,y+4,16,5,0,0,Math.PI*2);ctx.fill();
  // Canopy — layered pink circles
  ctx.fillStyle='rgba(240,192,216,0.8)';
  for(let i=0;i<8;i++){
    const ax=x+3+(i*3.5)%16,ay=y-24+(i*4)%18,r=8+(i%3)*3;
    ctx.beginPath();ctx.arc(ax,ay,r,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle='rgba(232,160,184,0.9)';
  for(let i=0;i<6;i++){
    const ax=x+5+(i*4)%14,ay=y-26+(i*5)%16,r=6+(i%2)*2;
    ctx.beginPath();ctx.arc(ax,ay,r,0,Math.PI*2);ctx.fill();
  }
  // Highlight petals
  ctx.fillStyle='rgba(255,220,240,0.7)';
  for(let i=0;i<3;i++){
    const ax=x+7+i*4,ay=y-28+i*3;
    ctx.beginPath();ctx.arc(ax,ay,4,0,Math.PI*2);ctx.fill();
  }
  // Falling petals
  ctx.fillStyle=P.sakuraL;
  for(let i=0;i<4;i++){
    const px=x-5+(i*8)+Math.sin((f+i)*0.03)*6,py=y-12+(i*6)+Math.cos((f+i)*0.04)*8;
    R(px,py,2,2,P.sakuraL);R(px+1,py+1,1,1,P.sakura);
  }
}

// CHEST — small chest under sakura
function drawChest(x,y){
  R(x,y,16,10,P.wdD);R(x+1,y+1,14,8,P.wd);
  R(x+1,y+1,14,2,P.wdL);
  R(x+5,y+4,6,3,P.gold); // lock
}

// ROUND TABLE — left of center plaza
function drawRoundTable(x,y){
  const r=16;
  ctx.fillStyle=P.shD;ctx.beginPath();ctx.ellipse(x,y+3,r+3,5,0,0,Math.PI*2);ctx.fill();
  R(x-2,y,4,11,P.wdD);R(x-5,y+11,10,2,P.wdD);
  ctx.fillStyle=P.wdL;ctx.beginPath();ctx.ellipse(x,y,r-1,r*0.38,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=P.wd;ctx.beginPath();ctx.ellipse(x,y-2,r-3,r*0.33,0,0,Math.PI*2);ctx.fill();
  // Items
  R(x-6,y-5,4,3,P.brass);R(x+3,y-6,6,2,P.paper);
}

// BENCH ROW — right side, like the flower benches in reference
function drawBenchRow(x,y){
  const len=70;
  // Bench
  R(x,y-2,len,4,P.wdL);R(x,y+2,len,2,P.wdD);
  // Legs (4)
  R(x+4,y+4,2,5,P.wdD);R(x+22,y+4,2,5,P.wdD);
  R(x+44,y+4,2,5,P.wdD);R(x+len-8,y+4,2,5,P.wdD);
  // Cushions
  R(x+3,y-4,20,3,P.rugG);R(x+28,y-4,20,3,P.rugM);
  R(x+50,y-4,16,3,P.rugG);
  // Flower pots behind bench (like reference flower beds)
  for(let px=x+5;px<x+len-8;px+=14){
    R(px,y-10,8,9,'#BC6C25');R(px+1,y-12,6,3,'#9C5A1C');
    R(px+1,y-14,3,9,P.g3);R(px+3,y-16,2,11,P.g4);
    // Yellow flowers (like reference)
    R(px+2,y-17,3,3,P.yellow);R(px+4,y-18,2,2,P.yellowD);
  }
}

// STUDY CORNER — bottom right
function drawBookshelf(x,y){
  const w=26,h=48;
  R(x,y,w,h,P.wdD);R(x+2,y+2,w-4,h-4,P.wd);
  for(let sy=y+7;sy<y+h-9;sy+=14){
    R(x+2,sy,w-4,3,P.wdD);
    const bks=['#C84B31','#264653','#2D6A4F','#D4A843','#8B5E3C','#457B9D','#6B3A5B'];
    for(let bx=x+5;bx<x+w-6;bx+=4)R(bx,sy+3,2.5,4+((bx*7+sy)%5),bks[(bx+sy)%bks.length|0]);
  }
}
function drawGlobe(x,y){
  R(x+1,y+12,8,2,P.wdD);R(x+3,y-6,5,20,P.wd);R(x-1,y-6,14,12,'#5B8C8C');
  R(x+1,y-4,10,8,'#7AB8B8');R(x+3,y-2,3,3,'#3D6B4A');R(x+8,y-3,2,4,'#3D6B4A');
}
function drawClock(x,y){
  R(x+2,y-8,14,28,P.wdD);R(x+4,y-6,10,26,P.wd);R(x+4,y-4,10,10,'#FEFAE0');
  R(x+5,y-3,8,8,'#FFFFFF');R(x+9,y-1,2,1,P.ink);R(x+9,y-3,1,3,P.ink);
  R(x+8,y+8,2,10,P.brass);R(x+7,y+16,4,3,P.gold);
}

// Left zone: lamp + tall plant
function drawLamp(x,y){
  R(x+3,y+10,6,2,P.wdD);R(x+5,y-10,2,22,P.wd);R(x+2,y-12,8,7,P.gold);
  R(x+3,y-10,6,3,'#F4E8C8');
  ctx.fillStyle='rgba(255,240,200,0.1)';ctx.beginPath();ctx.arc(x+6,y,20,0,Math.PI*2);ctx.fill();
}
function drawTallPlant(x,y){
  R(x+2,y+20,12,9,'#BC6C25');R(x+4,y+18,8,3,'#9C5A1C');
  R(x+4,y-3,3,19,P.g1);R(x+7,y-6,4,22,P.g2);R(x+9,y-1,3,17,P.g3);R(x+11,y-2,2,15,P.g4);
}
function drawCoatRack(x,y){
  R(x+3,y-6,2,28,P.wdD);R(x+5,y+20,5,2,P.wdD);R(x+2,y-8,8,3,P.wd);
  R(x+1,y-8,1,4,P.wdD);R(x+7,y-8,1,4,P.wdD);
  R(x+7,y-6,5,10,P.red);R(x+8,y-4,3,6,P.redD);
}

// Snack cart — right side
function drawSnackCart(x,y){
  R(x+2,y+4,22,7,P.wdD);R(x,y,26,5,P.wd);R(x,y-2,3,4,P.wdD);R(x+23,y-2,3,4,P.wdD);
  R(x+1,y+9,2,7,P.wdD);R(x+23,y+9,2,7,P.wdD);
  R(x+4,y-5,6,5,P.gold);R(x+5,y-4,4,3,'#F4E8C8');R(x+13,y-4,5,4,'#FFFFFF');R(x+19,y-5,5,5,'#F5E6C8');
}

// ═══ CHARACTERS ═══
// Spread along the plaza, each with clear personal space:
// 白露: x=95  (far left, near sakura)
// 青叶: x=175 (round table area)
// 阿哲: x=285 (center plaza)
// 蓝山: x=375 (right side of plaza)
// 小棠: x=450 (near bench)
// 言午: x=530 (walking near study corner)

const charDefs=[
  {name:'白露',sx:'#FADFC8',hr:'#1C1C1C',hr2:'#3A3A3A',top:'#E8E0D5',t2:'#C8C0B5',bot:'#4E4E6E',
   x:95,y:245,pose:'lean',dir:1,topic:5},
  {name:'青叶',sx:'#F5D6C0',hr:'#1A1A2E',hr2:'#2D2D4A',top:'#2D6A4F',t2:'#1B4332',bot:'#5A5A6A',
   x:175,y:232,pose:'sit',dir:1,topic:2,chX:155,chY:246},
  {name:'阿哲',sx:'#F4C9A8',hr:'#2D1B0E',hr2:'#4A2C18',top:'#264653',t2:'#1D353F',bot:'#3D3D5C',
   x:285,y:248,pose:'stand',dir:1,topic:0},
  {name:'蓝山',sx:'#F8D8C0',hr:'#2C1810',hr2:'#5A3830',top:'#457B9D',t2:'#1D3557',bot:'#4A4A5A',
   x:375,y:245,pose:'stand',dir:-1,topic:4},
  {name:'小棠',sx:'#FDE0C8',hr:'#5C2E0A',hr2:'#7A3E18',top:'#C84B31',t2:'#9E2B20',bot:'#4A4A6A',
   x:450,y:248,pose:'stand',dir:-1,topic:1},
  {name:'言午',sx:'#F0C8A8',hr:'#4A3520',hr2:'#6B4E30',top:'#D4A843',t2:'#B8922E',bot:'#3D3A4A',
   x:530,y:248,pose:'walk',dir:1,topic:3,wX:510,wR:[490,570]},
];

function drawChair(cx,cy){R(cx-5,cy-7,10,3,P.wdL);R(cx-5,cy-15,2,11,P.wd);R(cx+3,cy-15,2,11,P.wd);R(cx-5,cy,2,4,P.wdD);R(cx+3,cy,2,4,P.wdD)}

function drawChar(c,hv,f){
  const s=2.2,cx=c.x,cy=c.y-(c.pose==='sit'?6:0),ox=cx-5*s,oy=cy-22*s;
  ctx.save();
  ctx.fillStyle=P.sh;ctx.beginPath();ctx.ellipse(cx,cy+3,13,3.5,0,0,Math.PI*2);ctx.fill();
  // Legs
  if(c.pose==='stand'||c.pose==='lean'){
    R(ox+2*s,oy+16*s,2*s,7*s,c.bot);R(ox+8*s,oy+16*s,2*s,7*s,c.bot);
    R(ox+2*s,oy+22*s,2*s,1.5*s,'#2A2A3A');R(ox+8*s,oy+22*s,2*s,1.5*s,'#2A2A3A');
  }else if(c.pose==='sit'){
    R(ox+1*s,oy+15*s,3*s,3*s,c.bot);R(ox+1*s,oy+17*s,2*s,4*s,c.bot);R(ox+8*s,oy+17*s,2*s,4*s,c.bot);
  }else{
    const l=Math.sin(f*0.15)*2.2;
    R(ox+2*s,oy+16*s,2*s,7*s+l,c.bot);R(ox+8*s,oy+16*s,2*s,7*s-l,c.bot);
  }
  // Body
  if(c.pose==='sit'){R(ox+1.5*s,oy+9*s,9*s,7*s,c.top);R(ox+1.5*s,oy+13*s,9*s,2.5*s,c.t2)}
  else{R(ox+1.5*s,oy+9*s,9*s,8*s,c.top);R(ox+1.5*s,oy+14*s,9*s,2.5*s,c.t2)}
  // Arms
  if(c.pose==='stand'){R(ox+0.5*s,oy+9*s,2*s,6*s,c.top);R(ox+9.5*s,oy+9*s,2*s,6*s,c.top)}
  else if(c.pose==='sit'){R(ox+0.5*s,oy+9*s,2*s,5*s,c.top);R(ox+9.5*s,oy+10*s,2*s,4*s,c.top)}
  else if(c.pose==='walk'){const a=Math.sin(f*0.15)*2;R(ox+0.5*s,oy+9*s,2*s,7*s+a,c.top);R(ox+9.5*s,oy+9*s,2*s,7*s-a,c.top)}
  else{R(ox+0.5*s,oy+9*s,2*s,5*s,c.top);R(ox+9*s,oy+7*s,2*s,5*s,c.top)}
  // Head
  R(ox+0.5*s,oy-2*s,11*s,5*s,c.hr);R(ox+0.5*s,oy+1*s,2*s,5*s,c.hr);R(ox+9.5*s,oy+1*s,2*s,5*s,c.hr);
  R(ox+2*s,oy,8*s,6*s,c.sx);
  if(c.dir>=0){R(ox+5*s,oy+2.5*s,2*s,1.5*s,'#1A1A1A');R(ox+9*s,oy+2.5*s,2*s,1.5*s,'#1A1A1A')}
  else{R(ox+4*s,oy+2.5*s,2*s,1.5*s,'#1A1A1A');R(ox+8*s,oy+2.5*s,2*s,1.5*s,'#1A1A1A')}
  R(ox+3*s,oy+3.5*s,1.5*s,1*s,'rgba(200,100,100,0.4)');R(ox+8.5*s,oy+3.5*s,1.5*s,1*s,'rgba(200,100,100,0.4)');
  R(ox+6*s,oy+5*s,1.5*s,0.8*s,'#8B5E5E');
  R(ox+1*s,oy-1*s,10*s,2*s,c.hr2);
  if(Math.floor(f/150)%3===0&&f%150<5)R(ox+3*s,oy+3*s,7*s,1*s,c.sx);
  if(hv){ctx.strokeStyle='rgba(212,168,67,0.7)';ctx.lineWidth=1.2;ctx.beginPath();ctx.roundRect(ox-2,oy-4,14*s,25*s,3);ctx.stroke();ctx.fillStyle='#3D2B1F';ctx.font='bold 7px "Noto Sans SC"';ctx.textAlign='center';ctx.fillText('点击加入讨论',cx,oy-7);ctx.textAlign='start'}
  ctx.fillStyle='#6B5B4A';ctx.font='6px "Noto Sans SC"';ctx.textAlign='center';ctx.fillText(c.name,cx,c.pose==='sit'?cy+2:cy+6);ctx.textAlign='start';
  ctx.restore();
  drawBubble(cx,oy-5,c.topic,hv?P.gold:P.ink);
}

function drawBubble(cx,ty,ti,color){
  const t=topics[ti],txt=t.title.length>8?t.title.slice(0,8)+'…':t.title;
  ctx.font='bold 7px "Noto Sans SC"';const tw=ctx.measureText(txt).width,bw=tw+12,bh=15,bx=cx-bw/2,by=ty-bh-3;
  R(bx,by,bw,bh,'#FFFFFF');ctx.strokeStyle=color;ctx.lineWidth=0.8;ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle='#FFFFFF';ctx.beginPath();ctx.moveTo(cx-3,ty-3);ctx.lineTo(cx,ty+1);ctx.lineTo(cx+3,ty-3);ctx.fill();ctx.stroke();
  ctx.fillStyle=color;ctx.fillText(txt,bx+5,by+12);
}

// ═══ Hit ═══
function hit(mx,my){
  const r=c.getBoundingClientRect(),sx=W/r.width,sy=H/r.height,cx=(mx-r.left)*sx,cy=(my-r.top)*sy;
  for(let i=chars.length-1;i>=0;i--){const c2=chars[i],dx=cx-c2.x,dy=cy-(c2.y-22);if(dx*dx+dy*dy<24*24)return i}return -1;
}

// ═══ Main ═══
let chars=charDefs.map(d=>({...d})),hv=-1,f=0;
c.addEventListener('mousemove',e=>{const h=hit(e.clientX,e.clientY);if(h!==hv){hv=h;c.style.cursor=h>=0?'pointer':'default'}});
c.addEventListener('click',e=>{const h=hit(e.clientX,e.clientY);if(h>=0)window.location.href='pixel-discussion-v3.html?topic='+encodeURIComponent(topics[chars[h].topic].title)});
c.addEventListener('mouseleave',()=>{hv=-1});

function tick(){
  f++;
  chars.forEach(c=>{if(c.pose==='walk'){c.wX+=c.dir*0.45;if(c.wX>c.wR[1]){c.dir=-1;c.wX=c.wR[1]}if(c.wX<c.wR[0]){c.dir=1;c.wX=c.wR[0]}c.x=c.wX}});
  
  drawRoom();
  drawWindow(18,20);     // left wall, morning window
  drawTitleSign();        // top center
  drawBoard();            // right wall
  drawClock(608,30);      // far right top corner
  
  // ── Plaza surroundings (from left to right) ──
  drawSakura(48,180);     // sakura tree — left focal point
  drawChest(42,215);      // chest under sakura
  drawCoatRack(85,155);   // coat rack near entrance
  drawLamp(55,195);       // lamp
  drawRoundTable(155,302);// round table, left of plaza
  drawBenchRow(430,300);  // bench row with flowers — right side (like reference)
  drawSnackCart(426,272); // snack cart near bench
  drawBookshelf(595,152); // far right study corner
  drawGlobe(570,210);     // globe
  drawTallPlant(610,172); // tall plant
  
  // Chairs for seated chars
  chars.forEach(c=>{if(c.pose==='sit'&&c.chX)drawChair(c.chX,c.chY-2)});
  
  // Characters
  chars.forEach((c,i)=>drawChar(c,i===hv,f));
  
  requestAnimationFrame(tick);
}tick();
</script>
