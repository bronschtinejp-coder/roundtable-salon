    const pw=BELL_W,ph=count*44+10;

      notifItems.push({x:px+4,y:iy,w:pw-8,h:40,topicIdx:n.topicIdx});
    });
  }
}

function updateWalkers(){
  chars.forEach(ch=>{
    if(ch.pose!=='walk'||!ch.path)return;
    if(ch.pauseTimer>0){ch.pauseTimer--;return}
    ch.pathT+=0.004;
    if(ch.pathT>=1){ch.pathT=0;ch.pathIdx=(ch.pathIdx+1)%ch.path.length;if(Math.random()<0.3)ch.pauseTimer=80+Math.floor(Math.random()*60)}
    const curr=ch.path[ch.pathIdx],next=ch.path[(ch.pathIdx+1)%ch.path.length];
    ch.x=curr.x+(next.x-curr.x)*ch.pathT;ch.y=curr.y+(next.y-curr.y)*ch.pathT;
    ch.dir=(next.x-curr.x)>=0?1:-1;
  });
}

function drawChar(ch,hv,f){
  const cx=ch.x,cy=ch.y;
  const walkBob=ch.pose==='walk'?Math.abs(Math.sin(f*0.15))*2:0;
  const dy=-walkBob;
  const s=1.7;
  ctx.save();
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.06)';ctx.beginPath();ctx.ellipse(cx,cy+12*s,10*s,3*s,0,0,Math.PI*2);ctx.fill();
  // Legs
  if(ch.pose==='walk'){const st=Math.sin(f*0.15);R(cx-5*s,cy+5*s+dy,4*s,8*s+st*s,ch.bot);R(cx+1*s,cy+5*s+dy,4*s,8*s-st*s,ch.bot)}
  else if(ch.pose==='sit'){R(cx-5*s,cy+5*s,8*s,5*s,ch.bot)}
  else{R(cx-5*s,cy+5*s+dy,4*s,9*s,ch.bot);R(cx+1*s,cy+5*s+dy,4*s,9*s,ch.bot)}
  // Body
  R(cx-6*s,cy-5*s+dy,12*s,11*s,ch.top);
  R(cx-6*s,cy-5*s+dy,12*s,2*s,'rgba(255,255,255,0.22)');
  // Arms
  if(ch.pose==='walk'){const a=Math.sin(f*0.15)*s;R(cx-8*s,cy-4*s+dy,3*s,8*s+a,ch.top);R(cx+5*s,cy-4*s+dy,3*s,8*s-a,ch.top)}
  else{R(cx-8*s,cy-4*s+dy,3*s,8*s,ch.top);R(cx+5*s,cy-4*s+dy,3*s,8*s,ch.top)}
  // Head (big)
  R(cx-8*s,cy-18*s+dy,16*s,14*s,P.skin);
  // Hair
  R(cx-8*s,cy-20*s+dy,16*s,6*s,ch.hair);R(cx-8*s,cy-15*s+dy,3*s,4*s,ch.hair);R(cx+5*s,cy-15*s+dy,3*s,4*s,ch.hair);
  // Eyes
  R(cx-4*s,cy-12*s+dy,2.5*s,2.5*s,'#222');R(cx+2*s,cy-12*s+dy,2.5*s,2.5*s,'#222');
  // Mouth
  R(cx-1*s,cy-7*s+dy,2*s,1.5*s,'#CC8888');
  if(ch.acc==='glasses'){R(cx-5*s,cy-13*s+dy,4*s,3*s,P.outline);R(cx+1*s,cy-13*s+dy,4*s,3*s,P.outline);R(cx-1*s,cy-12*s+dy,2*s,1*s,P.outline)}
  if(ch.acc==='headset'){R(cx-9*s,cy-16*s+dy,2*s,8*s,P.outline);R(cx+7*s,cy-16*s+dy,2*s,8*s,P.outline);R(cx-7*s,cy-19*s+dy,14*s,2*s,P.outline)}
  if(ch.acc==='pin'){R(cx+4*s,cy-3*s+dy,2*s,2*s,P.gold)}
  if(ch.acc==='badge'){R(cx+2*s,cy+1*s+dy,3*s,3*s,P.gold)}
  if(ch.acc==='tie'){R(cx-1*s,cy-2*s+dy,2*s,5*s,'#7B2D1E')}
  if(ch.acc==='pad'){R(cx+7*s,cy+1*s+dy,3*s,5*s,P.glass)}
  // Blink
  if(Math.floor(f/200)%5===0&&f%200<3){R(cx-4*s,cy-12*s+dy,2.5*s,2.5*s,P.skin);R(cx+2*s,cy-12*s+dy,2.5*s,2.5*s,P.skin)}
  ctx.strokeStyle=P.outline;ctx.lineWidth=1;ctx.strokeRect(cx-8*s,cy-18*s+dy,16*s,14*s);ctx.strokeRect(cx-6*s,cy-5*s+dy,12*s,11*s);
  // Hover - cursor change only, no text tooltip
  if(hv){
    // no visual change, cursor already set to pointer
  }
   // Name
   ctx.fillStyle=P.ink;ctx.font='bold 9px "Microsoft YaHei"';ctx.textAlign='center';ctx.fillText(ch.name,cx,cy+18*s);ctx.textAlign='start';
   ctx.restore();
   // Bubble - show full topic title
   if(!hv){
    const t=topics[ch.topic],txt=t.title;
    ctx.font='bold 10px "Microsoft YaHei"';const tw=ctx.measureText(t.icon+' '+txt).width+12;
    const bx=cx-tw/2,by2=cy-36*s+dy;
    R(bx-1,by2-1,tw+2,18,'rgba(0,0,0,0.04)');
    R(bx,by2,tw,16,'#FFF');ctx.strokeStyle='#CCC';ctx.lineWidth=1;ctx.strokeRect(bx,by2,tw,16);
    ctx.fillStyle=P.ink;ctx.fillText(t.icon+' '+txt,bx+5,by2+12);
  }
}

// ═══ HIT DETECTION ═══
let hoveredNotif=-1,hoveredFeat=-1,hoveredTopic=-1,hv=-1;
function getCC(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function hitPanel(mx,my,items){for(let i=0;i<items.length;i++){const it=items[i];if(mx>=it.x&&mx<=it.x+it.w&&my>=it.y&&my<=it.y+it.h)return i}return -1}

let chars=charDefs.map(d=>({...d})),f=0;

c.addEventListener('mousemove',e=>{
  const{x:mx,y:my}=getCC(e);
  let ch=-1;for(let i=chars.length-1;i>=0;i--){const c2=chars[i],dx=mx-c2.x,dy2=my-(c2.y-4);if(Math.abs(dx)<20&&Math.abs(dy2)<34){ch=i;break}}
  hv=ch;
  hoveredNotif=notifOpen?hitPanel(mx,my,notifItems):-1;
  hoveredFeat=hitPanel(mx,my,featItems);
  hoveredTopic=hitPanel(mx,my,topicItems);
  // Bell hover
  const bellHit=mx>=BELL_X&&mx<=BELL_X+40&&my>=BELL_Y&&my<=BELL_Y+32;
  c.style.cursor=(hv>=0||hoveredNotif>=0||hoveredFeat>=0||hoveredTopic>=0||bellHit)?'pointer':'default';
});

c.addEventListener('click',e=>{
  const{x:mx,y:my}=getCC(e);
  // Bell click
  if(mx>=BELL_X&&mx<=BELL_X+40&&my>=BELL_Y&&my<=BELL_Y+32){notifOpen=!notifOpen;return}
  // Close notif if clicking outside
  if(notifOpen){const ni=hitPanel(mx,my,notifItems);if(ni>=0){window.location.href='pixel-discussion-v10.html?topic='+encodeURIComponent(topics[notifItems[ni].topicIdx].title);return}notifOpen=false}
  // Characters
  for(let i=chars.length-1;i>=0;i--){const c2=chars[i],dx=mx-c2.x,dy2=my-(c2.y-4);if(Math.abs(dx)<18&&Math.abs(dy2)<30){window.location.href='pixel-discussion-v10.html?topic='+encodeURIComponent(topics[chars[i].topic].title);return}}
  // Panels
  const fi=hitPanel(mx,my,featItems);if(fi>=0){window.location.href='pixel-discussion-v10.html?topic='+encodeURIComponent(topics[featItems[fi].topicIdx].title);return}
  const ti=hitPanel(mx,my,topicItems);if(ti>=0){window.location.href='pixel-discussion-v10.html?topic='+encodeURIComponent(topics[topicItems[ti].topicIdx].title);return}
});
c.addEventListener('mouseleave',()=>{hv=-1;hoveredNotif=-1;hoveredFeat=-1;hoveredTopic=-1});

// ═══ MAIN LOOP ═══
function tick(){
  f++;ctx.clearRect(0,0,W,H);
  updateWalkers();
  drawRoom();
  drawMainTitleBoard();
  drawHotTopicsBoard();drawFeaturedBoard();
  // front lead desk / reception
  drawDesk(332,266);drawChairAt(398,308,'#5D6670');
  R(256,250,112,72,'#EFEFEF');ctx.strokeStyle='#7F8A95';ctx.strokeRect(256,250,112,72);R(262,256,100,60,'#FFFFFF');
  drawShelfAt(512,228,92);drawShelfAt(566,228,92);
  // main workstations - orderly 2x3 block
  drawDesk(600,324);drawChairAt(666,366,'#5D6670');
  drawDesk(792,324);drawChairAt(858,366,'#5D6670');
  drawDesk(984,324);drawChairAt(1050,366,'#5D6670');
  drawDesk(600,420);drawChairAt(666,462,'#5D6670');
  drawDesk(792,420);drawChairAt(858,462,'#5D6670');
  drawDesk(984,420);drawChairAt(1050,462,'#5D6670');
  // lounge corner
  R(1038,452,116,28,'#EFEFEF');R(1044,458,104,16,'#FAFAFA');
  drawCarpet();
  drawCabinet(1090,488,70,44);drawTrashBin(934,372);drawTrashBin(742,468);
  drawCoffeeMachine(1120,504);drawPlantAt(1148,514,1.1);drawPlantAt(94,548,1.2);
  drawConsoleStack(520,274);
  // Characters (drawn last, on top)
  chars.forEach((ch,i)=>drawChar(ch,i===hv,f));
  // Notification (always on top)
  drawNotification();
  requestAnimationFrame(tick);
}
tick();
</script>
