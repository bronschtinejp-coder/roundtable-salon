<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回响圆桌 · 讨论中</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#1a1220;font-family:'Microsoft YaHei','微软雅黑',sans-serif;overflow:hidden;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  #container{width:100vw;height:100vh;max-width:1280px;max-height:720px;aspect-ratio:16/9;display:flex;border:3px solid #3E2210;box-shadow:0 0 40px rgba(0,0,0,0.5)}
  /* Left: scene */
  #scene{flex:0 0 50%;position:relative;background:#2A1808}
  #c{position:absolute;top:0;left:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
  #back{position:absolute;top:12px;left:12px;z-index:5;background:#3E2210;border:2px solid #E8B830;color:#F5E6C8;font-size:11px;font-weight:700;padding:5px 14px;cursor:pointer;transition:all 0.15s}
  #back:hover{background:#E8B830;color:#2A1808;border-color:#FFD84D}
  /* Right: chat panel */
  #chat{flex:1;display:flex;flex-direction:column;background:#F5E6C8;border-left:4px solid #3E2210;font-size:13px;position:relative;overflow:hidden}
  #chat-hdr{padding:12px 16px;font-weight:700;color:#2A1808;border-bottom:3px solid #8B6B4A;text-align:center;font-size:14px;letter-spacing:2px;flex-shrink:0;background:#E8D5B0;position:relative;z-index:2}
  #msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth;position:relative;z-index:1}
  #msgs::-webkit-scrollbar{width:8px}
  #msgs::-webkit-scrollbar-track{background:#E8D5B0}
  #msgs::-webkit-scrollbar-thumb{background:#8B6B4A;border-radius:4px}
  .msg{display:flex;flex-direction:column;max-width:88%;animation:fIn .3s ease}
  .msg.self{align-self:flex-end}.msg.other{align-self:flex-start}
  .msg .nm{font-size:11px;font-weight:700;margin-bottom:3px;padding:0 6px;letter-spacing:1px}
  .msg.self .nm{text-align:right;color:#8B2020}.msg.other .nm{color:#264653}
  .msg .bb{padding:9px 12px;font-size:12px;line-height:1.6;word-break:break-word;border:2px solid;position:relative}
  .msg.self .bb{background:#3E2210;color:#F5E6C8;border-color:#6B4226;border-radius:2px 2px 0 2px}
  .msg.other .bb{background:#FFFDF5;color:#2A1808;border-color:#C8B090;border-radius:2px 2px 2px 0;box-shadow:1px 1px 0 rgba(139,107,74,0.15)}
  .msg .tm{font-size:9px;color:#8B6B4A;margin-top:3px;padding:0 6px}
  .msg.self .tm{text-align:right}
  .msg.other .nm::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle;border:1px solid rgba(0,0,0,0.2)}
  .msg.other[data-char="\u963F\u54F2"] .nm::before{background:#264653}
  .msg.other[data-char="\u5C0F\u68E0"] .nm::before{background:#C84040}
  .msg.other[data-char="\u9752\u53F6"] .nm::before{background:#2B5E3A}
  .msg.other[data-char="\u8A00\u5348"] .nm::before{background:#E8B830}
  .msg.other[data-char="\u84DD\u5C71"] .nm::before{background:#4A7BA8}
  @keyframes fIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  #typing{padding:5px 14px 8px;font-size:11px;color:#8B6B4A;font-style:italic;min-height:22px;flex-shrink:0;position:relative;z-index:1}
  #inp-wrap{padding:12px 14px;border-top:3px solid #8B6B4A;display:flex;gap:8px;flex-shrink:0;background:#E8D5B0;position:relative;z-index:2}
  #inp-wrap input{flex:1;border:2px solid #8B6B4A;padding:9px 12px;font-family:'Microsoft YaHei',sans-serif;font-size:13px;background:#FFFDF5;color:#2A1808;outline:none;transition:border-color 0.2s}
  #inp-wrap input:focus{border-color:#E8B830;box-shadow:0 0 0 1px #E8B830}
  #inp-wrap input::placeholder{color:#B8A080}
  #inp-wrap button{border:2px solid #3E2210;background:#3E2210;color:#F5E6C8;font-family:'Microsoft YaHei',sans-serif;font-size:12px;font-weight:700;padding:9px 18px;cursor:pointer;letter-spacing:2px;white-space:nowrap;transition:all 0.15s}
  #inp-wrap button:hover{background:#E8B830;color:#2A1808;border-color:#E8B830}
  #ai-assist-btn{padding:9px 10px !important;letter-spacing:0 !important;font-size:14px !important;background:#E8D5B0 !important;border-color:#E8B830 !important;color:#B8901E !important}
  #ai-assist-btn:hover{background:#E8B830 !important;color:#2A1808 !important}
  #ai-assist-btn.active{background:#E8B830 !important;color:#2A1808 !important;box-shadow:0 0 6px rgba(232,184,48,0.4)}

  /* ═══ AI Material Sidebar ═══ */
  #ai-sidebar{
    position:absolute;top:0;left:0;right:0;bottom:0;z-index:10;
    background:rgba(42,24,8,0.5);display:none;flex-direction:column;justify-content:flex-end;
  }
  #ai-sidebar.show{display:flex}
  #ai-panel{
    background:#F5E6C8;border-top:3px solid #E8B830;max-height:60%;overflow-y:auto;
    padding:0;animation:slideUp .25s ease;
  }
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  #ai-panel-hdr{
    padding:10px 14px;background:#3E2210;color:#E8B830;font-size:12px;font-weight:700;
    display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1;
  }
  #ai-panel-hdr span{cursor:pointer;font-size:14px;padding:0 4px}
  #ai-panel-hdr span:hover{color:#FFD84D}
  .ai-card{
    margin:10px 12px;padding:10px 12px;background:#FFFDF5;border:1px solid #C8B090;
    border-left:3px solid #E8B830;font-size:11px;line-height:1.6;color:#2A1808;
  }
  .ai-card .ai-src{font-size:9px;color:#8B6B4A;margin-top:6px}
  .ai-card .ai-tag{display:inline-block;background:#E8B830;color:#2A1808;font-size:9px;padding:1px 6px;margin-right:4px;font-weight:700}
  .ai-card .ai-title{font-weight:700;font-size:12px;margin-bottom:6px;color:#2A1808}
  .ai-card .ai-summary{margin-bottom:6px}
  .ai-card .ai-points{margin:6px 0;padding-left:14px}
  .ai-card .ai-points li{margin-bottom:3px;font-size:10px;line-height:1.5}
  .ai-card .ai-quote{font-size:10px;color:#5C4033;border-left:2px solid #C8B090;padding-left:8px;margin:6px 0;font-style:italic}
  .ai-card .ai-data{display:inline-block;background:#2B5E3A;color:#FFF;font-size:9px;padding:1px 6px;margin-top:4px;font-weight:700;border-radius:1px}
  .ai-card .ai-relevance{font-size:9px;color:#2B5E3A;font-weight:700;margin-top:4px}
  .ai-card .ai-use-btn{
    display:inline-block;margin-top:6px;padding:3px 10px;font-size:10px;font-weight:700;
    background:#E8D5B0;border:1px solid #B8901E;color:#2A1808;cursor:pointer;
    font-family:'Microsoft YaHei',sans-serif;transition:all 0.15s;
  }
  .ai-card .ai-use-btn:hover{background:#E8B830;border-color:#E8B830}

  /* ═══ AI Card Editor ═══ */
  #ai-editor{
    display:none;position:absolute;top:0;left:0;bottom:0;z-index:20;
    width:50%;background:rgba(42,24,8,0.85);
    flex-direction:column;padding:16px;
  }
  #ai-editor.show{display:flex}
  #ai-editor-box{
    background:#F5E6C8;border:2px solid #E8B830;
    flex:1;display:flex;flex-direction:column;animation:fIn .2s ease;
    overflow:hidden;
  }
  #ai-editor-hdr{
    padding:10px 14px;background:#3E2210;color:#E8B830;font-size:12px;font-weight:700;
    display:flex;justify-content:space-between;align-items:center;flex-shrink:0;
  }
  #ai-editor-hdr span{cursor:pointer;font-size:14px}
  #ai-editor-hdr span:hover{color:#FFD84D}
  #ai-editor-src{font-size:10px;color:#8B6B4A;padding:8px 14px;border-bottom:1px solid #E8D5B0;flex-shrink:0}
  #ai-editor textarea{
    flex:1;margin:10px 14px;padding:10px;border:2px solid #C8B090;background:#FFFDF5;
    font-family:'Microsoft YaHei',sans-serif;font-size:12px;line-height:1.8;color:#2A1808;
    resize:none;outline:none;
  }
  #ai-editor textarea:focus{border-color:#E8B830}
  #ai-editor-actions{
    padding:8px 14px 12px;display:flex;gap:8px;justify-content:flex-end;flex-shrink:0;
  }
  #ai-editor-actions button{
    padding:6px 16px;font-size:11px;font-weight:700;cursor:pointer;
    font-family:'Microsoft YaHei',sans-serif;border:2px solid;transition:all 0.15s;
  }
  #ai-editor-cancel{background:#E8D5B0;border-color:#8B6B4A;color:#2A1808}
  #ai-editor-cancel:hover{background:#C8B090}
  #ai-editor-send{background:#E8B830;border-color:#E8B830;color:#2A1808}
  #ai-editor-send:hover{background:#FFD84D}

  /* ═══ AI Writing Assistant Panel ═══ */
  #ai-suggest{
    display:none;position:absolute;bottom:68px;left:14px;right:14px;z-index:15;
    background:#FFFDF5;border:2px solid #E8B830;padding:0;font-size:11px;
    line-height:1.5;color:#2A1808;box-shadow:0 -2px 8px rgba(0,0,0,0.12);
    animation:fIn .2s ease;max-height:55vh;overflow-y:auto;
  }
  #ai-suggest::-webkit-scrollbar{width:6px}
  #ai-suggest::-webkit-scrollbar-thumb{background:#C8B090;border-radius:3px}
  .ai-sug-hdr{font-weight:700;color:#E8B830;font-size:10px;padding:8px 12px;background:#3E2210;position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center}
  .ai-sug-hdr span{cursor:pointer;font-size:12px;padding:0 2px}
  .ai-sug-hdr span:hover{color:#FFD84D}
  .ai-sug-section{padding:8px 12px;border-bottom:1px solid #E8D5B0}
  .ai-sug-section:last-child{border-bottom:none}
  .ai-sug-section .section-title{font-weight:700;font-size:10px;color:#B8901E;margin-bottom:4px}
  .ai-sug-section ul{margin:4px 0;padding-left:16px}
  .ai-sug-section li{margin-bottom:3px;font-size:11px;line-height:1.5}
  .ai-sug-section li.kb{color:#2B5E3A;font-weight:700}
  .ai-sug-section .struct-box{background:#F0E8D0;border:1px solid #D8C8A0;padding:8px 10px;margin-top:4px;font-size:10px;line-height:1.7}
  .ai-sug-section .struct-box .struct-label{font-weight:700;color:#5C4033}
  .ai-sug-section .struct-box .struct-point{color:#264653;margin-left:8px}
  .ai-sug-section .struct-box .struct-data{color:#2B5E3A;font-weight:700;font-size:9px;margin-left:8px}
  .ai-sug-actions{padding:8px 12px;display:flex;gap:6px;justify-content:flex-end;border-top:1px solid #E8D5B0}
  .ai-sug-actions button{
    font-size:10px;padding:4px 10px;border:1px solid #8B6B4A;background:#E8D5B0;color:#2A1808;
    cursor:pointer;font-family:'Microsoft YaHei',sans-serif;font-weight:700;
  }
  .ai-sug-actions button.primary{background:#E8B830;border-color:#E8B830}
  .ai-sug-actions button:hover{opacity:0.85}

  /* ═══ AI Fallback Message ═══ */
  .msg.ai-fallback{align-self:stretch;max-width:100%}
  .msg.ai-fallback .nm{color:#B8901E}
  .msg.ai-fallback .nm::before{background:#E8B830 !important}
  .msg.ai-fallback .bb{
    background:#FFFDF5;color:#2A1808;border:2px dashed #E8B830;border-radius:2px;
    font-size:11px;padding:8px 12px;
  }
  .msg.ai-fallback .fb-hdr{font-weight:700;color:#B8901E;font-size:11px;margin-bottom:6px;display:flex;align-items:center;gap:4px}
  .msg.ai-fallback .fb-toggle{
    font-size:10px;color:#8B6B4A;cursor:pointer;margin-top:6px;text-decoration:underline;
  }
  .msg.ai-fallback .fb-toggle:hover{color:#E8B830}
  .msg.ai-fallback .fb-body{margin-top:6px}
  .msg.ai-fallback.collapsed .fb-body{display:none}
  .msg.ai-fallback .fb-item{
    margin-bottom:6px;cursor:pointer;padding:4px 6px;border-radius:2px;transition:background 0.15s;
  }
  .msg.ai-fallback .fb-item:hover{background:rgba(232,184,48,0.1)}
  .msg.ai-fallback .fb-item strong{color:#B8901E;border-bottom:1px dashed #B8901E}
  .msg.ai-fallback .fb-item .fb-peek{font-size:10px;color:#5C4033;margin-top:2px}
  .msg.ai-fallback .fb-detail{
    display:none;margin:6px 0 10px;padding:10px 12px;background:#FFF;
    border:1px solid #E8B830;border-left:3px solid #E8B830;font-size:11px;line-height:1.6;
    animation:fIn .2s ease;
  }
  .msg.ai-fallback .fb-detail.show{display:block}
  .msg.ai-fallback .fb-detail .fd-title{font-weight:700;font-size:12px;color:#2A1808;margin-bottom:6px}
  .msg.ai-fallback .fb-detail .fd-tag{display:inline-block;background:#E8B830;color:#2A1808;font-size:9px;padding:1px 6px;margin-right:4px;font-weight:700}
  .msg.ai-fallback .fb-detail .fd-points{margin:6px 0;padding-left:14px}
  .msg.ai-fallback .fb-detail .fd-points li{margin-bottom:3px;font-size:10px}
  .msg.ai-fallback .fb-detail .fd-quote{font-size:10px;color:#5C4033;border-left:2px solid #C8B090;padding-left:8px;margin:6px 0;font-style:italic}
  .msg.ai-fallback .fb-detail .fd-data{display:inline-block;background:#2B5E3A;color:#FFF;font-size:9px;padding:1px 6px;margin-top:4px;font-weight:700}
  .msg.ai-fallback .fb-detail .fd-src{font-size:9px;color:#8B6B4A;margin-top:6px}
  .msg.ai-fallback .fb-detail .fd-close{font-size:10px;color:#8B6B4A;cursor:pointer;text-decoration:underline;margin-top:6px;display:inline-block}
  .msg.ai-fallback .fb-detail .fd-close:hover{color:#E8B830}

  /* ═══ Insight Card ═══ */
  #insight-card{
    display:none;margin:12px;padding:0;border:2px solid #E8B830;background:#FFFDF5;
    animation:fIn .4s ease;
  }
  #insight-card.show{display:block}
  #insight-hdr{
    padding:8px 12px;background:#3E2210;color:#E8B830;font-size:12px;font-weight:700;
    display:flex;align-items:center;gap:6px;
  }
  #insight-body{padding:10px 12px;font-size:11px;line-height:1.7;color:#2A1808}
  #insight-body .ins-section{margin-bottom:8px}
  #insight-body .ins-label{font-weight:700;color:#2B5E3A;font-size:10px;margin-bottom:2px}
  #insight-body .ins-people{font-size:9px;color:#8B6B4A;margin-top:8px;padding-top:6px;border-top:1px solid #E8D5B0}

  /* ═══ AI Proactive Question ═══ */
  .msg.ai-question{align-self:stretch;max-width:100%}
  .msg.ai-question .nm{color:#B8901E}
  .msg.ai-question .nm::before{background:#E8B830 !important}
  .msg.ai-question .bb{
    background:#FFFDF5;color:#2A1808;border:2px solid #E8B830;border-radius:2px;
    font-size:12px;padding:10px 12px;line-height:1.6;
  }
  .msg.ai-question .aq-label{font-size:9px;color:#B8901E;font-weight:700;margin-bottom:4px}
  .msg.ai-question .aq-context{font-size:9px;color:#8B6B4A;margin-top:6px;font-style:italic}
</style>
</head>
<body>
<div id="container">
<div id="scene">
  <canvas id="c"></canvas>
  <button id="back" onclick="history.back()">← 返回沙龙</button>
  <!-- AI Card Editor (overlays left scene area) -->
  <div id="ai-editor">
    <div id="ai-editor-box">
      <div id="ai-editor-hdr">
        <div>✏️ 引用编辑</div>
        <span onclick="closeEditor()">✕</span>
      </div>
      <div id="ai-editor-src"></div>
      <textarea id="ai-editor-text"></textarea>
      <div id="ai-editor-actions">
        <button id="ai-editor-cancel" onclick="closeEditor()">取消</button>
        <button id="ai-editor-send" onclick="sendFromEditor()">发送到讨论</button>
      </div>
    </div>
  </div>
</div>
<div id="chat">
  <div id="chat-hdr">讨论中</div>
  <div id="msgs"></div>
  <div id="typing"></div>

  <!-- AI Material Sidebar (overlays chat area) -->
  <div id="ai-sidebar">
    <div id="ai-panel">
      <div id="ai-panel-hdr">
        <div>💡 AI 素材参考 · 点击卡片可引用编辑</div>
        <span id="ai-close" title="关闭">✕</span>
      </div>
      <div id="ai-materials"></div>
    </div>
  </div>

  <!-- AI Writing Assistant Panel -->
  <div id="ai-suggest">
    <div id="ai-sug-text"></div>
  </div>

  <div id="inp-wrap">
    <input type="text" id="mi" placeholder="输入你的观点，加入讨论…" maxlength="120"/>
    <button id="ai-assist-btn" onclick="toggleAISuggest()" title="AI 写作助手">💡</button>
    <button onclick="send()">发 言</button>
  </div>

  <!-- Insight Card (appended at bottom of chat) -->
  <div id="insight-card">
    <div id="insight-hdr">📋 设计洞察卡 · AI整理</div>
    <div id="insight-body"></div>
  </div>
</div>
</div>

<script>
// ═══════════════════════════════════════
//  Canvas Scene (same as v4, compact)
// ═══════════════════════════════════════
const W=640,H=720,ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;
function sz(){const s=Math.min(scene.clientWidth/W,scene.clientHeight/H);c.width=W;c.height=H;c.style.width=(W*s)+'px';c.style.height=(H*s)+'px'}
window.addEventListener('resize',sz);sz();
function R(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x|0,y|0,w|0,h|0)}
const P={wall:'#5C4033',wallL:'#6B4E3D',wallD:'#4A3228',beam:'#3E2812',beamL:'#5A3E1E',trim:'#2E1A0C',wpDark:'#6B4E35',wallpaper:'#8B6B4A',wpLight:'#A07850',floor:'#8B6B4A',floorL:'#A07850',floorD:'#6B4E35',floorH:'#B8925E',wd:'#6B4226',wdL:'#8B5A36',wdD:'#3E2210',wdH:'#A0703C',stone:'#6B6B6B',stoneL:'#8A8A8A',stoneD:'#4A4A4A',fire1:'#FF6B2B',fire2:'#FFAA33',fire3:'#FFD84D',g1:'#2B5E3A',g2:'#3D8B4A',g3:'#5FB066',g4:'#8BC870',gold:'#E8B830',goldL:'#FFD84D',goldD:'#B8901E',red:'#C84040',redD:'#9B2828',blue:'#4A7BA8',rug:'#8B2020',rugG:'#CC8833',rugC:'#AA4420',rugEdge:'#4A0E0E',paper:'#F5E6C8',ink:'#2A1808',sky:'#3A5C8A',skyTop:'#1E3A5C',star:'#FFE8AA',moon:'#E8E0C0',warm:'rgba(255,200,100,',shadow:'rgba(20,10,5,'};
const charColors=[
  {name:'阿哲',sx:'#F4C9A8',hr:'#2D1B0E',hr2:'#4A2C18',hrStyle:'spiky',top:'#264653',t2:'#1D353F',bot:'#3D3D5C',acc:'#4A7BA8'},
  {name:'小棠',sx:'#FDE0C8',hr:'#5C2E0A',hr2:'#7A3E18',hrStyle:'bob',top:'#C84040',t2:'#9B2828',bot:'#4A4A6A',acc:'#FFD84D'},
  {name:'青叶',sx:'#F5D6B8',hr:'#1A1A2E',hr2:'#2E2E4A',hrStyle:'short',top:'#2B5E3A',t2:'#1B4332',bot:'#3A3A5A',acc:'#E8B830'},
  {name:'言午',sx:'#EEBB99',hr:'#4A3520',hr2:'#6B4E30',hrStyle:'tied',top:'#E8B830',t2:'#B8901E',bot:'#3D3A4A',acc:'#C84040'},
  {name:'蓝山',sx:'#F8D8C0',hr:'#2C1810',hr2:'#4A3020',hrStyle:'neat',top:'#4A7BA8',t2:'#2E5C80',bot:'#3A3A5A',acc:'#E8B830'},
];
let frame=0,active=-1;

function drawChar(cx,cy,ci,act,f){
  const s=3.2,ox=cx-6*s,oy=cy-24*s;
  ctx.save();
  ctx.fillStyle=P.shadow+'0.1)';ctx.beginPath();ctx.ellipse(cx,cy+3,12,3.5,0,0,Math.PI*2);ctx.fill();

let sugVisible=false;

function analyzeInput(text){
  const t=text.trim();
  // Section 1: Writing tips
  const tips=[];
  if(!t){
    tips.push('补充你的项目背景或具体场景，其他人更容易给出针对性建议');
    tips.push('如果是提问，描述你目前尝试过的方案和遇到的问题');
    tips.push('如果是观点，附上支撑的数据或案例会更有说服力');
  } else {
    if(t.length<15) tips.push('当前内容较短，补充具体场景或案例会让讨论更聚焦');
    if(!t.match(/[。！？，、]/)) tips.push('可以分点阐述，让观点结构更清晰');
    if(t.match(/怎么|如何|咋/)) tips.push('提问时补充品类、目标用户、当前阶段等上下文');
    if(t.match(/好不好|行不行|能不能/)) tips.push('拆解为具体维度（留存、付费、体验），讨论更深入');
    if(t.match(/为什么|为啥/)) tips.push('附上你观察到的具体现象或数据');
    if(t.match(/我觉得|我认为|个人感觉/)) tips.push('补充支撑的案例或数据会更有说服力');
    if(t.match(/不同意|反对|但是/)) tips.push('说明基于什么经验得出的不同结论，比单纯否定更有建设性');
    if(tips.length===0) tips.push('当前内容表述清晰，可以直接发送');
  }

  // Section 2: Structure scaffold + supporting data
  let scaffold=null;
  if(t.length>=4){
    scaffold={thesis:'',angles:[],data:[]};
    // Extract thesis
    if(t.match(/我觉得|我认为|个人感觉/)){
      scaffold.thesis=t.replace(/^.*(我觉得|我认为|个人感觉)/,'').slice(0,30);
    } else if(t.length>=6){
      scaffold.thesis=t.slice(0,30)+(t.length>30?'…':'');
    }
    // Suggest expansion angles based on content
    if(t.match(/通用流派|流派/)){
      scaffold.angles=['工作量对比：专属 vs 通用的人力成本差异','玩家反馈：社区讨论活跃度和UGC产出变化','适用场景：什么品类/阶段适合通用流派'];
      scaffold.data=['通用流派工作量: 0.5人周/角色 vs 专属: 3人周/角色','《星渊纪元》切换后社区讨论量 +40%'];
    } else if(t.match(/数值|PVE|爽感/)){
      scaffold.angles=['数值策略：放大倍率的合理区间','体验验证：玩家爽感评分的变化','风险控制：对PVP平衡和长期留存的影响'];
      scaffold.data=['《星渊纪元》PVE爽感评分: 3.2→4.6','7日留存 +12% / 首月付费 +18%'];
    } else if(t.match(/随机|抽签|Roguelike|rogue/i)){
      scaffold.angles=['前提条件：底层玩法质量的要求','应用场景：PVE vs PVP的策略差异','设计边界：随机性的"可控度"和"影响范围"'];
      scaffold.data=['38%头部产品尝试Roguelike融合，留存显著提升仅12%','成功案例共性：随机性限定在"构建"阶段'];
    } else if(t.match(/角色|适配|工作量/)){
      scaffold.angles=['量产效率：不同方案的人力投入对比','质量把控：如何在效率和精度间取舍','玩家感知：玩家真的需要角色专属设计吗'];
      scaffold.data=['40角色专属→120人周 vs 通用流派→20人周'];
    } else {
      scaffold.angles=['支撑案例：有没有类似的项目经验','数据验证：能否量化这个判断','适用边界：什么情况下这个观点成立/不成立'];
      scaffold.data=[];
    }
  }

  // Section 3: KB hints
  const kbHints=[];
  if(t.match(/随机|抽签|Roguelike|rogue/i)) kbHints.push('有3条关于"抽签玩法"的过往讨论');
  if(t.match(/数值|爽感|PVE/i)) kbHints.push('项目B"PVE数值放大"复盘数据');
  if(t.match(/流派|角色|适配/)) kbHints.push('言午的通用流派实践经验');
  if(t.match(/留存|付费|商业化/)) kbHints.push('行业Roguelike融合品类趋势报告');

  return {tips,scaffold,kbHints};
}

  // Section 1: Tips
  html+='<div class="ai-sug-section"><div class="section-title">📝 写作建议</div><ul>';
  result.tips.forEach(t=>html+=`<li>${t}</li>`);
  html+='</ul></div>';

  // Section 2: Structure scaffold
  if(result.scaffold){

  // Actions
  html+='<div class="ai-sug-actions"><button onclick="openMaterialsFromBtn()">📎 查看完整素材</button></div>';

}

          </div>
          <div class="tm">${now()}</div>`;
        msgsEl.appendChild(d);msgsEl.scrollTop=msgsEl.scrollHeight;
        msgCount++;
        checkInsightCard();
      },1200);
    },1500+Math.random()*1000);
  }
}

// ═══════════════════════════════════════
//  Send Message
// ═══════════════════════════════════════
function send(){
  const t=mi.value.trim();if(!t)return;mi.value='';
  // Close AI panels
  document.getElementById('ai-suggest').style.display='none';
  document.getElementById('ai-assist-btn').classList.remove('active');
  sugVisible=false;
  document.getElementById('ai-sidebar').classList.remove('show');
  addMsg('',t,true);active=-1;msgCount++;

  // Collapse AI fallback if present
  const fb=document.querySelector('.msg.ai-fallback');
  if(fb&&!fb.classList.contains('collapsed')){
    fb.classList.add('collapsed');
    const tog=fb.querySelector('.fb-toggle');if(tog)tog.textContent='查看AI参考 ▼';
  }
  // Cancel pending fallback
  if(fallbackTimer){clearTimeout(fallbackTimer);fallbackTimer=null}

  // Pick 2-3 different characters to reply
  const pool=[...charColors];
  const replyCount=2+Math.floor(Math.random()*2); // 2 or 3
  const picked=[];
  for(let i=0;i<replyCount&&pool.length>0;i++){
    const idx=Math.floor(Math.random()*pool.length);
    picked.push(pool.splice(idx,1)[0]);
  }

  // Per-character reply styles
  const styleMap={
    '阿哲':[
      '我觉得关键还是要看底层数据，光靠感觉判断容易踩坑。',
      '这个思路可以，但要注意和核心玩法的适配度，别做成两张皮。',
      '从系统设计角度看，这个方案的复杂度可能需要提前评估一下。',
    ],
    '小棠':[
      '我们项目之前试过类似的，效果比预期好不少，可以展开聊聊。',
      '有道理，不过实际落地的时候资源和排期都得考虑进去。',
      '这个方向值得试，但建议先做个小规模验证，别一上来就铺开。',
    ],
    '青叶':[
      '从玩家体验角度看，这个点子挺有吸引力的。问题是怎么量化效果。',
      '确实，我看到的几个案例也是这么做的，核心是把"爽感"做到位。',
      '这让我想到《星渊纪元》的做法，思路类似但细节上有些不同。',
    ],
    '言午':[
      '这个角度很有意思。工作量方面我有一些实际经验可以分享。',
      '同意判断，但具体实现上可能需要分阶段来，一步到位风险太高。',
      '我之前在复盘里写过相关内容，回头把链接贴出来大家参考。',
    ],
    '蓝山':[
      '能展开说说你们是怎么具体执行的吗？想了解一下实际操作层面的细节。',
      '跟我观察到的趋势吻合。行业里确实越来越多团队在往这个方向走。',
      '好观点。不过我觉得不同用户群体的接受度可能差异很大，不能一概而论。',
    ],
  };

  let delay=1200+Math.random()*800;
  picked.forEach((ch,i)=>{
    const ri=charColors.findIndex(c=>c.name===ch.name);
    const pool2=styleMap[ch.name]||['这个角度值得深入讨论。'];
    const reply=pool2[Math.floor(Math.random()*pool2.length)];
    setTimeout(()=>{
      if(i===0)typing.textContent=ch.name+' 正在输入…';
      setTimeout(()=>{
        typing.textContent='';
        addMsg(ch.name,reply);
        active=ri;msgCount++;
        checkInsightCard();
        // Queue next replier's typing indicator
        if(i<picked.length-1){
          setTimeout(()=>{typing.textContent=picked[i+1].name+' 正在输入…'},400);
        } else {
          setTimeout(()=>{active=-1;maybeAIQuestion()},2000);
        }
      },800+Math.random()*600);
    },delay*i);
  });
}
mi.addEventListener('keydown',e=>{if(e.key==='Enter')send()});

// ═══ Main Loop ═══
function tick(){frame++;drawScene(frame);requestAnimationFrame(tick)}tick();
</script>
