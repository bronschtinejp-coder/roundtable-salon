// ═══ ROOM - Kairosoft office top-down ═══
function drawRoom(){
  // Wall (shorter, less empty space)
  R(0,0,W,150,P.wall);
  R(0,0,W,18,'#E9F3FB');
  for(let x=0;x<W;x+=28)R(x,17,16,2,'#D7E7F5');

  R(0,146,W,4,P.wallD);
  // Baseboard
  R(0,150,W,8,P.baseboard);
  // Floor (warm beige tiles, larger area)
  R(0,158,W,H-158,P.floor);
  for(let y=158;y<H;y+=40){
    for(let x=0;x<W;x+=40){
      const alt=((x/40)+(y/40))%2===0;
      R(x,y,40,40,alt?P.floorB:P.floor);
      R(x,y+38,40,2,P.floorLine);
      R(x+38,y,2,40,P.floorLine);

}

// ═══ NOTIFICATION (collapsed bell icon, expands on click) ═══
const notifications=[

  {icon:'👍',text:'你的观点被 5 人点赞',topic:'抽签玩法融合的成与败',topicIdx:0},

];
const notifItems=[];
let notifOpen=false;
const BELL_X=30,BELL_Y=640,BELL_W=220;

function drawNotification(){
  notifItems.length=0;
  const bx=BELL_X,by=BELL_Y;
  // Bell button
  R(bx,by,40,32,P.white);ctx.strokeStyle=P.panelBord;ctx.lineWidth=1;ctx.strokeRect(bx,by,40,32);
  ctx.font='16px "Microsoft YaHei"';ctx.fillText('🔔',bx+10,by+22);
  const count=notifications.length;
  if(count>0){R(bx+30,by+2,14,12,P.red);ctx.fillStyle='#FFF';ctx.font='bold 9px "Microsoft YaHei"';ctx.fillText(count.toString(),bx+34,by+11)}
  
  // Expanded panel (pops UP from the bell)
  if(notifOpen){
    const pw=BELL_W,ph=count*44+10;
    const px=bx,py=by-ph-4;
    R(px+2,py+2,pw,ph,P.shadow);
    R(px,py,pw,ph,P.white);ctx.strokeStyle=P.panelBord;ctx.lineWidth=1;ctx.strokeRect(px,py,pw,ph);
    R(px,py,pw,3,P.orange);
    notifications.forEach((n,i)=>{
      const iy=py+6+i*44;
      const isH=hoveredNotif===i;
      R(px+4,iy,pw-8,40,isH?'#FFF8F0':'#FAFCFF');
      R(px+4,iy,2,40,P.orange);
      ctx.font='12px "Microsoft YaHei"';ctx.fillText(n.icon,px+12,iy+18);
      ctx.fillStyle=P.ink;ctx.font='bold 10px "Microsoft YaHei"';ctx.fillText(n.text,px+30,iy+18);
      ctx.fillStyle=P.inkLight;ctx.font='9px "Microsoft YaHei"';
      ctx.fillText('→ '+n.topic.slice(0,12)+'…',px+30,iy+33);
      notifItems.push({x:px+4,y:iy,w:pw-8,h:40,topicIdx:n.topicIdx});
    });
  }
}

function updateWalkers(){
  chars.forEach(ch=>{
    if(ch.pose!=='walk'||!ch.path)return;
    if(ch.pauseTimer>0){ch.pauseTimer--;return}
    ch.pathT+=0.006;
    if(ch.pathT>=1){ch.pathT=0;ch.pathIdx=(ch.pathIdx+1)%ch.path.length;if(Math.random()<0.3)ch.pauseTimer=80+Math.floor(Math.random()*60)}
    const curr=ch.path[ch.pathIdx],next=ch.path[(ch.pathIdx+1)%ch.path.length];
    ch.x=curr.x+(next.x-curr.x)*ch.pathT;ch.y=curr.y+(next.y-curr.y)*ch.pathT;
    ch.dir=(next.x-curr.x)>=0?1:-1;
  });
}

function drawChar(ch,hv,f){
  const cx=ch.x,cy=ch.y;
  const walkBob=ch.pose==='walk'?Math.abs(Math.sin(f*0.15))*2:0;
  const dy=-walkBob;
  const s=1.5;// scale up from original
  ctx.save();
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.06)';ctx.beginPath();ctx.ellipse(cx,cy+12*s,10*s,3*s,0,0,Math.PI*2);ctx.fill();
  // Legs
  if(ch.pose==='walk'){const st=Math.sin(f*0.15);R(cx-5*s,cy+5*s+dy,4*s,8*s+st*s,ch.bot);R(cx+1*s,cy+5*s+dy,4*s,8*s-st*s,ch.bot)}
  else if(ch.pose==='sit'){R(cx-5*s,cy+5*s,8*s,5*s,ch.bot)}
  else{R(cx-5*s,cy+5*s+dy,4*s,9*s,ch.bot);R(cx+1*s,cy+5*s+dy,4*s,9*s,ch.bot)}
  // Body
  R(cx-6*s,cy-5*s+dy,12*s,11*s,ch.top);
  R(cx-6*s,cy-5*s+dy,12*s,2*s,'rgba(255,255,255,0.22)');
  // Arms
  if(ch.pose==='walk'){const a=Math.sin(f*0.15)*s;R(cx-8*s,cy-4*s+dy,3*s,8*s+a,ch.top);R(cx+5*s,cy-4*s+dy,3*s,8*s-a,ch.top)}
  else{R(cx-8*s,cy-4*s+dy,3*s,8*s,ch.top);R(cx+5*s,cy-4*s+dy,3*s,8*s,ch.top)}
  // Head (big)
  R(cx-8*s,cy-18*s+dy,16*s,14*s,P.skin);
  // Hair
  R(cx-8*s,cy-20*s+dy,16*s,6*s,ch.hair);R(cx-8*s,cy-15*s+dy,3*s,4*s,ch.hair);R(cx+5*s,cy-15*s+dy,3*s,4*s,ch.hair);
  // Eyes
  R(cx-4*s,cy-12*s+dy,2.5*s,2.5*s,'#222');R(cx+2*s,cy-12*s+dy,2.5*s,2.5*s,'#222');
  // Mouth
  R(cx-1*s,cy-7*s+dy,2*s,1.5*s,'#CC8888');
  if(ch.acc==='glasses'){R(cx-5*s,cy-13*s+dy,4*s,3*s,P.outline);R(cx+1*s,cy-13*s+dy,4*s,3*s,P.outline);R(cx-1*s,cy-12*s+dy,2*s,1*s,P.outline)}
  if(ch.acc==='headset'){R(cx-9*s,cy-16*s+dy,2*s,8*s,P.outline);R(cx+7*s,cy-16*s+dy,2*s,8*s,P.outline);R(cx-7*s,cy-19*s+dy,14*s,2*s,P.outline)}
  if(ch.acc==='pin'){R(cx+4*s,cy-3*s+dy,2*s,2*s,P.gold)}
  if(ch.acc==='badge'){R(cx+2*s,cy+1*s+dy,3*s,3*s,P.gold)}
  if(ch.acc==='tie'){R(cx-1*s,cy-2*s+dy,2*s,5*s,'#7B2D1E')}
  if(ch.acc==='pad'){R(cx+7*s,cy+1*s+dy,3*s,5*s,P.glass)}
  // Blink
  if(Math.floor(f/200)%5===0&&f%200<3){R(cx-4*s,cy-12*s+dy,2.5*s,2.5*s,P.skin);R(cx+2*s,cy-12*s+dy,2.5*s,2.5*s,P.skin)}
  ctx.strokeStyle=P.outline;ctx.lineWidth=1;ctx.strokeRect(cx-8*s,cy-18*s+dy,16*s,14*s);ctx.strokeRect(cx-6*s,cy-5*s+dy,12*s,11*s);
  // Hover - cursor change only, no text tooltip
  if(hv){
    // no visual change, cursor already set to pointer
  }
  // Name
  ctx.fillStyle=P.ink;ctx.font='bold 10px "Microsoft YaHei"';ctx.textAlign='center';
  ctx.fillText(ch.name,cx,cy+18*s);ctx.textAlign='start';
  ctx.restore();
  // Bubble - show full topic title
  if(!hv){
    const t=topics[ch.topic],txt=t.title;
    ctx.font='bold 10px "Microsoft YaHei"';const tw=ctx.measureText(t.icon+' '+txt).width+12;
    const bx=cx-tw/2,by2=cy-36*s+dy;
    R(bx-1,by2-1,tw+2,18,'rgba(0,0,0,0.04)');
    R(bx,by2,tw,16,'#FFF');ctx.strokeStyle='#CCC';ctx.lineWidth=1;ctx.strokeRect(bx,by2,tw,16);
    ctx.fillStyle=P.ink;ctx.fillText(t.icon+' '+txt,bx+5,by2+12);
  }
}

// ═══ HIT DETECTION ═══
let hoveredNotif=-1,hoveredFeat=-1,hoveredTopic=-1,hv=-1;
function getCC(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function hitPanel(mx,my,items){for(let i=0;i<items.length;i++){const it=items[i];if(mx>=it.x&&mx<=it.x+it.w&&my>=it.y&&my<=it.y+it.h)return i}return -1}

let chars=charDefs.map(d=>({...d})),f=0;

c.addEventListener('mousemove',e=>{
  const{x:mx,y:my}=getCC(e);
  let ch=-1;for(let i=chars.length-1;i>=0;i--){const c2=chars[i],dx=mx-c2.x,dy2=my-(c2.y-4);if(Math.abs(dx)<16&&Math.abs(dy2)<24){ch=i;break}}
  hv=ch;
  hoveredNotif=notifOpen?hitPanel(mx,my,notifItems):-1;
  hoveredFeat=hitPanel(mx,my,featItems);
  hoveredTopic=hitPanel(mx,my,topicItems);
  // Bell hover
  const bellHit=mx>=BELL_X&&mx<=BELL_X+40&&my>=BELL_Y&&my<=BELL_Y+32;
  c.style.cursor=(hv>=0||hoveredNotif>=0||hoveredFeat>=0||hoveredTopic>=0||bellHit)?'pointer':'default';
});

c.addEventListener('click',e=>{
  const{x:mx,y:my}=getCC(e);
  // Bell click
  if(mx>=BELL_X&&mx<=BELL_X+40&&my>=BELL_Y&&my<=BELL_Y+32){notifOpen=!notifOpen;return}
  // Close notif if clicking outside
  if(notifOpen){const ni=hitPanel(mx,my,notifItems);if(ni>=0){window.location.href='pixel-discussion-v7.html?topic='+encodeURIComponent(topics[notifItems[ni].topicIdx].title);return}notifOpen=false}
  // Characters
  for(let i=chars.length-1;i>=0;i--){const c2=chars[i],dx=mx-c2.x,dy2=my-(c2.y-4);if(Math.abs(dx)<16&&Math.abs(dy2)<24){window.location.href='pixel-discussion-v7.html?topic='+encodeURIComponent(topics[chars[i].topic].title);return}}
  // Panels
  const fi=hitPanel(mx,my,featItems);if(fi>=0){window.location.href='pixel-discussion-v7.html?topic='+encodeURIComponent(topics[featItems[fi].topicIdx].title);return}
  const ti=hitPanel(mx,my,topicItems);if(ti>=0){window.location.href='pixel-discussion-v7.html?topic='+encodeURIComponent(topics[topicItems[ti].topicIdx].title);return}
});
c.addEventListener('mouseleave',()=>{hv=-1;hoveredNotif=-1;hoveredFeat=-1;hoveredTopic=-1});

// ═══ MAIN LOOP ═══
function tick(){
  f++;ctx.clearRect(0,0,W,H);
  updateWalkers();
  drawRoom();
  // Wall panels
  drawTitle();
  drawHotTopicsBoard();
  drawFeaturedBoard();
  drawBanner(470,82,160,'新作企划室','#4D8FD0');
  drawBanner(650,82,160,'成员讨论中','#6DAF62');
  drawPoster(420,12,96,54,'#5FA6D4','年度佳作','GAME AWARD');
  drawPoster(764,12,96,54,'#61B36B','开发日程','SPRINT OK');
  drawDevShelf(550,142);drawDevShelf(674,142);
  // Bookshelves along walls (top edge of floor)
  drawShelfAt(30,160,100);drawShelfAt(80,160,100);
  drawShelfAt(1200,160,100);drawShelfAt(1250,160,100);
  drawCabinet(522,170,72,56);drawCabinet(686,170,72,56);
  drawConsoleStack(536,196);drawConsoleStack(702,196);
  // Furniture layout (distributed across room)
  drawCarpet();
  // Left desk cluster (2x2)
  drawDesk(180,340);drawDesk(320,340);drawChairAt(200,374,P.chair);drawChairAt(340,374,'#55AA66');
  drawDesk(180,450);drawDesk(320,450);drawChairAt(200,484,P.orange);drawChairAt(340,484,P.purple);
  // Right desk cluster (2x2)
  drawDesk(750,340);drawDesk(890,340);drawChairAt(770,374,P.blue);drawChairAt(910,374,P.red);
  drawDesk(750,450);drawDesk(890,450);drawChairAt(770,484,'#55AA66');drawChairAt(910,484,P.orange);
  // Center meeting area
  R(530,400,100,50,P.deskD);R(532,402,96,46,P.desk);R(532,402,96,4,P.deskTop);
  R(550,396,14,5,'#FFF');R(580,396,14,5,'#EEE');R(610,396,10,5,'#DDF');// papers
  drawChairAt(540,454,P.blue);drawChairAt(580,454,P.green);drawChairAt(620,454,P.orange);
  drawTrashBin(162,392);drawTrashBin(732,392);drawTrashBin(1034,506);
  // Plants in corners
  drawPlantAt(10,560,1.4);drawPlantAt(1240,560,1.4);drawPlantAt(1240,310,1.2);drawPlantAt(10,310,1.2);
  // Coffee corner (right wall)
  drawCoffeeMachine(1210,420);drawWaterCooler(1240,420);
  // Characters (drawn last, on top)
  chars.forEach((ch,i)=>drawChar(ch,i===hv,f));
  // Notification (always on top)
  drawNotification();
  requestAnimationFrame(tick);
}
tick();
</script>
