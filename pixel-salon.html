<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回响圆桌 · 知识沙龙</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap');
  
  :root {
    --bg: #FFFFFF;
    --wall: #F8F5F0;
    --floor: #F0EBE0;
    --navy: #2D4A6E;
    --rust: #C75B39;
    --sage: #7A9A7E;
    --mustard: #D4A84B;
    --dusty-blue: #5B7FA5;
    --dark: #333333;
    --light-gray: #E8E5E0;
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: var(--bg);
    font-family: 'Noto Sans SC', sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
  }
  
  #container {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 1600px;
    max-height: 900px;
    aspect-ratio: 16/9;
  }
  
  #pixel-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: pointer;
  }
  
  /* UI overlay */
  #header {
    position: absolute;
    top: 20px;
    left: 0; right: 0;
    text-align: center;
    z-index: 10;
    pointer-events: none;
  }
  
  #header h1 {
    display: inline-block;
    font-size: 18px;
    font-weight: 700;
    color: var(--dark);
    letter-spacing: 4px;
    background: rgba(255,255,255,0.85);
    padding: 8px 24px;
    border: 2px solid var(--dark);
    image-rendering: pixelated;
  }
  
  #subtitle {
    position: absolute;
    top: 75px;
    left: 0; right: 0;
    text-align: center;
    z-index: 10;
    pointer-events: none;
  }
  
  #subtitle span {
    font-size: 13px;
    color: var(--navy);
    letter-spacing: 3px;
  }
  
  /* Tooltip for topic hover */
  #tooltip {
    position: absolute;
    z-index: 20;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    background: var(--bg);
    border: 2px solid var(--dark);
    padding: 10px 14px;
    font-size: 14px;
    color: var(--dark);
    max-width: 260px;
    box-shadow: 3px 3px 0px rgba(0,0,0,0.1);
  }
  
  #tooltip .topic-title { font-weight: 700; margin-bottom: 4px; }
  #tooltip .topic-hint { font-size: 11px; color: var(--rust); }
</style>
</head>
<body>
<div id="container">
  <canvas id="pixel-canvas"></canvas>
  <div id="header"><h1>回 响 圆 桌</h1></div>
  <div id="subtitle"><span>知 识 沙 龙</span></div>
  <div id="tooltip">
    <div class="topic-title"></div>
    <div class="topic-hint"></div>
  </div>
</div>

<script>
// ─── Pixel Art Knowledge Salon ───
const CANVAS_W = 640;
const CANVAS_H = 360;
const PX = 2; // pixel scale

const canvas = document.getElementById('pixel-canvas');
const ctx = canvas.getContext('2d');

// Scale canvas to fill container while maintaining aspect ratio
function resize() {
  const container = document.getElementById('container');
  const cw = container.clientWidth;
  const ch = container.clientHeight;
  const scale = Math.min(cw / CANVAS_W, ch / CANVAS_H);
  canvas.width = CANVAS_W;
  canvas.height = CANVAS_H;
  canvas.style.width = (CANVAS_W * scale) + 'px';
  canvas.style.height = (CANVAS_H * scale) + 'px';
  canvas.style.left = ((cw - CANVAS_W * scale) / 2) + 'px';
  canvas.style.top = ((ch - CANVAS_H * scale) / 2) + 'px';
}
window.addEventListener('resize', resize);
resize();

// ─── Topics ───
const topics = [
  { id: 'topic-001', title: '抽签玩法融合的成与败', category: 'Roguelike' },
  { id: 'topic-002', title: '社交系统设计的得与失', category: '社交' },
  { id: 'topic-003', title: 'AI 如何重塑关卡设计', category: 'AI+游戏' },
  { id: 'topic-004', title: '叙事与机制的结合边界', category: '叙事' },
  { id: 'topic-005', title: '商业化与玩家体验平衡', category: '商业化' },
  { id: 'topic-006', title: '开放世界的内容密度', category: '关卡' },
];

// ─── Character definitions (pixel sprites) ───
// Each character is a 12x16 grid. 0=transparent, 1=skin, 2=hair, 3=shirt, 4=pants
const CHAR_SPRITES = [
  { // char 0: standing, navy shirt
    name: '阿哲', hair: '#2D2D2D', shirt: '#2D4A6E', pants: '#555555', skin: '#F4D0B5',
  },
  { // char 1: standing, rust shirt
    name: '小棠', hair: '#3A1F0D', shirt: '#C75B39', pants: '#4A4A6A', skin: '#FDE0C8',
  },
  { // char 2: sitting, sage
    name: '青叶', hair: '#1A1A2E', shirt: '#7A9A7E', pants: '#6B6B6B', skin: '#F5D6C0',
  },
  { // char 3: walking, mustard
    name: '言午', hair: '#4A3520', shirt: '#D4A84B', pants: '#3D3D5C', skin: '#F0C8A8',
  },
  { // char 4: sitting, dusty blue
    name: '蓝山', hair: '#2C1810', shirt: '#5B7FA5', pants: '#505050', skin: '#F8D8C0',
  },
  { // char 5: standing, white/cream
    name: '白露', hair: '#1C1C1C', shirt: '#E8E0D5', pants: '#4E4E6E', skin: '#FADFC8',
  },
];

// Character positions & states
function createCharacters() {
  const floorY = 120;
  return [
    { x: 80,  y: floorY, sprite: 0, pose: 'stand', dir: 1,  topic: 0, bobOffset: 0 },
    { x: 200, y: floorY, sprite: 1, pose: 'sit',   dir: -1, topic: 1, bobOffset: 0, chairX: 200, chairY: floorY - 8 },
    { x: 320, y: floorY, sprite: 2, pose: 'stand', dir: -1, topic: 2, bobOffset: 0 },
    { x: 440, y: floorY, sprite: 3, pose: 'walk',  dir: 1,  topic: 3, bobOffset: 0, walkPhase: 0, walkDir: 1, walkX: 420, walkRange: [380, 500] },
    { x: 540, y: floorY, sprite: 4, pose: 'sit',   dir: -1, topic: 4, bobOffset: 0, chairX: 540, chairY: floorY - 8 },
    { x: 160, y: floorY, sprite: 5, pose: 'lean',  dir: 1,  topic: 5, bobOffset: 0, leanWallX: 160 },
  ];
}

let characters = createCharacters();
let hoveredChar = -1;
let mouseX = 0, mouseY = 0;
let frameCount = 0;

// ─── Drawing helpers ───
function pxFill(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), Math.ceil(w), Math.ceil(h));
}

function pxStroke(x, y, w, h, color, lineW = 1) {
  ctx.strokeStyle = color;
  ctx.lineWidth = lineW;
  ctx.strokeRect(Math.floor(x), Math.floor(y), Math.ceil(w), Math.ceil(h));
}

function drawPixelChar(cx, cy, sprite, pose, dir, frame) {
  const s = CHAR_SPRITES[sprite];
  const sc = 2.5; // sprite scale
  const bw = 10 * sc, bh = 14 * sc;
  const ox = cx - bw/2;
  const oy = cy - bh;
  
  ctx.save();
  
  // ─── Body ───
  // Legs
  if (pose === 'stand' || pose === 'lean') {
    pxFill(ox + 3*sc, oy + 10*sc, 2*sc, 4*sc, s.pants);
    pxFill(ox + 6*sc, oy + 10*sc, 2*sc, 4*sc, s.pants);
  } else if (pose === 'sit') {
    // Sitting: legs forward
    pxFill(ox + 2*sc, oy + 8*sc, 3*sc, 2*sc, s.pants);
    pxFill(ox + 2*sc, oy + 9*sc, 2*sc, 3*sc, s.pants);
    pxFill(ox + 6*sc, oy + 10*sc, 2*sc, 2*sc, s.pants);
  } else if (pose === 'walk') {
    const legPhase = Math.sin(frame * 0.15) * 2;
    pxFill(ox + 3*sc, oy + 10*sc, 2*sc, 4*sc + legPhase, s.pants);
    pxFill(ox + 6*sc, oy + 10*sc, 2*sc, 4*sc - legPhase, s.pants);
  }
  
  // Torso
  pxFill(ox + 2*sc, oy + 5*sc, 7*sc, 6*sc, s.shirt);
  
  // Arms (with subtle variation)
  if (pose === 'stand') {
    pxFill(ox + 1*sc, oy + 5*sc, 2*sc, 5*sc, s.shirt);
    pxFill(ox + 8*sc, oy + 5*sc, 2*sc, 5*sc, s.shirt);
  } else if (pose === 'sit') {
    pxFill(ox + 1*sc, oy + 5*sc, 2*sc, 4*sc, s.shirt);
    pxFill(ox + 8*sc, oy + 6*sc, 2*sc, 3*sc, s.shirt);
  } else if (pose === 'walk') {
    const armSwing = Math.sin(frame * 0.15) * 1.5;
    pxFill(ox + 1*sc, oy + 5*sc, 2*sc, 5*sc + armSwing, s.shirt);
    pxFill(ox + 8*sc, oy + 5*sc, 2*sc, 5*sc - armSwing, s.shirt);
  } else if (pose === 'lean') {
    pxFill(ox + 1*sc, oy + 5*sc, 2*sc, 3*sc, s.shirt);
    pxFill(ox + 8*sc, oy + 4*sc, 2*sc, 3*sc, s.shirt); // arm up leaning
  }
  
  // ─── Head ───
  // Hair (back)
  pxFill(ox + 2*sc, oy + 0, 7*sc, 5*sc, s.hair);
  // Face
  pxFill(ox + 3*sc, oy + 1*sc, 5*sc, 4*sc, s.skin);
  
  // Eyes
  const eyeY = oy + 2.5*sc;
  if (dir >= 0) {
    pxFill(ox + 5*sc, eyeY, 2*sc, 1*sc, '#333');
    pxFill(ox + 8*sc, eyeY, 2*sc, 1*sc, '#333');
  } else {
    pxFill(ox + 4*sc, eyeY, 2*sc, 1*sc, '#333');
    pxFill(ox + 7*sc, eyeY, 2*sc, 1*sc, '#333');
  }
  
  // Blink every 2-3 seconds
  if (Math.floor(frame / 180) % 3 === 0 && frame % 180 < 4) {
    ctx.fillStyle = s.skin;
    if (dir >= 0) {
      ctx.fillRect(ox + 5*sc, eyeY, 2*sc, 1*sc);
      ctx.fillRect(ox + 8*sc, eyeY, 2*sc, 1*sc);
    } else {
      ctx.fillRect(ox + 4*sc, eyeY, 2*sc, 1*sc);
      ctx.fillRect(ox + 7*sc, eyeY, 2*sc, 1*sc);
    }
  }
  
  // Mouth
  pxFill(ox + 6*sc, oy + 4*sc, 1*sc, 1*sc, '#333');
  
  ctx.restore();
}

function drawSpeechBubble(cx, topY, topic, isHovered) {
  const t = topics[topic];
  const maxChars = 10;
  const text = t.title.length > maxChars ? t.title.slice(0, maxChars) + '…' : t.title;
  const charW = 5.5;
  const bw = text.length * charW + 14;
  const bh = 20;
  const bx = cx - bw/2;
  const by = topY - bh - 6;
  
  // Bubble background
  ctx.fillStyle = isHovered ? '#FFF8E7' : '#FFFFFF';
  ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = isHovered ? '#C75B39' : '#333333';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, bw, bh);
  
  // Tail
  ctx.fillStyle = isHovered ? '#FFF8E7' : '#FFFFFF';
  ctx.beginPath();
  ctx.moveTo(cx - 4, topY - 6);
  ctx.lineTo(cx, topY);
  ctx.lineTo(cx + 4, topY - 6);
  ctx.fill();
  ctx.strokeStyle = isHovered ? '#C75B39' : '#333333';
  ctx.stroke();
  
  // Text
  ctx.fillStyle = isHovered ? '#C75B39' : '#333333';
  ctx.font = 'bold 9px "Noto Sans SC"';
  ctx.textAlign = 'center';
  ctx.fillText(text, cx, by + 14);
  ctx.textAlign = 'start';
}

function drawChair(cx, cy) {
  // Simple pixel chair
  const sc = 2.5;
  const c = '#8B7355';
  // Seat
  pxFill(cx - 6*sc, cy, 12*sc, 2*sc, c);
  // Back
  pxFill(cx - 6*sc, cy - 8*sc, 2*sc, 10*sc, c);
  // Legs
  pxFill(cx - 6*sc, cy + 1*sc, 1*sc, 3*sc, '#6B5B45');
  pxFill(cx + 5*sc, cy + 1*sc, 1*sc, 3*sc, '#6B5B45');
}

function drawPlant(x, y) {
  // Pixel potted plant
  pxFill(x, y + 10, 14, 12, '#C75B39'); // pot
  pxFill(x + 2, y + 8, 10, 3, '#7A5A3A'); // dirt
  // Leaves
  pxFill(x + 1, y + 2, 3, 7, '#7A9A7E');
  pxFill(x + 5, y, 4, 8, '#6B8E6B');
  pxFill(x + 9, y + 2, 3, 7, '#7A9A7E');
  pxFill(x + 3, y + 1, 3, 5, '#8AAA8A');
}

function drawBookshelf(x, y) {
  const w = 40, h = 50;
  pxFill(x, y, w, h, '#8B7355');
  pxFill(x + 2, y + 2, w - 4, h - 4, '#A0896C');
  // Shelves
  for (let sy = y + 2; sy < y + h - 8; sy += 12) {
    pxFill(x + 2, sy, w - 4, 2, '#7A6348');
    // Books
    const colors = ['#C75B39', '#2D4A6E', '#5B7FA5', '#D4A84B', '#7A9A7E'];
    for (let bx = x + 4; bx < x + w - 6; bx += 5) {
      const bh = 6 + Math.floor(Math.random() * 4);
      const bc = colors[Math.floor(Math.random() * colors.length)];
      pxFill(bx, sy + 2, 3, bh, bc);
    }
  }
}

function drawFloorPattern() {
  // Subtle floor tile grid
  ctx.strokeStyle = '#E8E3D8';
  ctx.lineWidth = 0.5;
  for (let x = 0; x < CANVAS_W; x += 16) {
    ctx.beginPath();
    ctx.moveTo(x, 110);
    ctx.lineTo(x, CANVAS_H);
    ctx.stroke();
  }
  for (let y = 110; y < CANVAS_H; y += 16) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(CANVAS_W, y);
    ctx.stroke();
  }
}

function drawWallDecoration() {
  // Simple framed pictures on wall
  const frames = [
    { x: 100, y: 30, w: 40, h: 28 },
    { x: 350, y: 20, w: 30, h: 40 },
    { x: 550, y: 30, w: 36, h: 28 },
  ];
  frames.forEach(f => {
    pxFill(f.x, f.y, f.w, f.h, '#D4A84B'); // frame
    pxFill(f.x + 3, f.y + 3, f.w - 6, f.h - 6, '#FFFFFF'); // mat
    // Abstract pixel art inside
    const innerColors = ['#2D4A6E', '#C75B39', '#7A9A7E', '#5B7FA5'];
    for (let ix = f.x + 5; ix < f.x + f.w - 5; ix += 2) {
      for (let iy = f.y + 5; iy < f.y + f.h - 5; iy += 2) {
        if (Math.random() > 0.5) {
          pxFill(ix, iy, 2, 2, innerColors[Math.floor(Math.random() * innerColors.length)]);
        }
      }
    }
  });
}

function drawSalonScene() {
  // ─── Background ───
  // Wall (top 30%)
  ctx.fillStyle = '#F8F5F0';
  ctx.fillRect(0, 0, CANVAS_W, 105);
  
  // Baseboard
  ctx.fillStyle = '#E8E3D8';
  ctx.fillRect(0, 100, CANVAS_W, 5);
  ctx.fillStyle = '#D5CFC5';
  ctx.fillRect(0, 105, CANVAS_W, 3);
  
  // Floor
  ctx.fillStyle = '#F0EBE0';
  ctx.fillRect(0, 108, CANVAS_W, CANVAS_H - 108);
  drawFloorPattern();
  
  // ─── Wall decorations ───
  drawWallDecoration();
  
  // ─── Furniture ───
  // Bookshelf (far left back)
  drawBookshelf(560, 35);
  // Plant
  drawPlant(20, 75);
  
  // ─── Characters ───
  characters.forEach((ch, idx) => {
    const isHovered = idx === hoveredChar;
    let cx = ch.x, cy = ch.y;
    
    // Handle walking character
    if (ch.pose === 'walk') {
      ch.walkX += ch.walkDir * 0.4;
      if (ch.walkX > ch.walkRange[1]) { ch.walkDir = -1; ch.dir = -1; }
      if (ch.walkX < ch.walkRange[0]) { ch.walkDir = 1; ch.dir = 1; }
      cx = ch.walkX;
      ch.x = cx;
      
      // Slight vertical bob
      ch.bobOffset = Math.abs(Math.sin(frameCount * 0.15)) * 2;
    }
    
    // Draw chair for sitting characters
    if (ch.pose === 'sit' && ch.chairX) {
      drawChair(ch.chairX - 10, ch.chairY);
    }
    
    // Hover highlight
    if (isHovered) {
      ctx.fillStyle = 'rgba(199,91,57,0.08)';
      ctx.beginPath();
      ctx.ellipse(cx, cy - 16, 28, 12, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    
    // Draw character
    const actualY = cy - ch.bobOffset;
    drawPixelChar(cx, actualY, ch.sprite, ch.pose, ch.dir, frameCount);
    
    // Speech bubble above head, higher for standing, lower for sitting
    const bubbleTop = actualY - (ch.pose === 'sit' ? 22 : 30);
    drawSpeechBubble(cx, bubbleTop, ch.topic, isHovered);
  });
  
  // ─── Click hint ───
  if (hoveredChar >= 0) {
    const ch = characters[hoveredChar];
    const hintY = ch.y - 60;
    ctx.fillStyle = '#C75B39';
    ctx.font = '9px "Noto Sans SC"';
    ctx.textAlign = 'center';
    ctx.fillText('点击进入讨论 →', ch.x, hintY);
    ctx.textAlign = 'start';
  }
}

// ─── Hit detection ───
function getCharAt(mx, my) {
  // Convert screen coords to canvas coords
  const rect = canvas.getBoundingClientRect();
  const scaleX = CANVAS_W / rect.width;
  const scaleY = CANVAS_H / rect.height;
  const cx = (mx - rect.left) * scaleX;
  const cy = (my - rect.top) * scaleY;
  
  for (let i = characters.length - 1; i >= 0; i--) {
    const ch = characters[i];
    const dist = Math.sqrt((cx - ch.x) ** 2 + (cy - (ch.y - 20)) ** 2);
    if (dist < 30) return i;
  }
  return -1;
}

// ─── Mouse events ───
canvas.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  const idx = getCharAt(e.clientX, e.clientY);
  if (idx !== hoveredChar) {
    hoveredChar = idx;
    canvas.style.cursor = idx >= 0 ? 'pointer' : 'default';
    
    // Update tooltip
    const tooltip = document.getElementById('tooltip');
    if (idx >= 0) {
      const t = topics[characters[idx].topic];
      tooltip.querySelector('.topic-title').textContent = t.title;
      tooltip.querySelector('.topic-hint').textContent = '#' + t.category + '  ·  点击进入';
      tooltip.style.opacity = '1';
      tooltip.style.left = (e.clientX + 20) + 'px';
      tooltip.style.top = (e.clientY - 40) + 'px';
    } else {
      tooltip.style.opacity = '0';
    }
  }
  if (idx >= 0) {
    const tooltip = document.getElementById('tooltip');
    tooltip.style.left = (e.clientX + 20) + 'px';
    tooltip.style.top = (e.clientY - 40) + 'px';
  }
});

canvas.addEventListener('click', (e) => {
  const idx = getCharAt(e.clientX, e.clientY);
  if (idx >= 0) {
    const topic = topics[characters[idx].topic];
    // Transition to discussion view — for now, alert + open in new window
    window.open('pixel-discussion.html?topic=' + encodeURIComponent(topic.id), '_self');
  }
});

canvas.addEventListener('mouseleave', () => {
  hoveredChar = -1;
  document.getElementById('tooltip').style.opacity = '0';
});

// ─── Animation loop ───
function animate() {
  frameCount++;
  
  // Update walking characters
  characters.forEach(ch => {
    if (ch.pose === 'walk') {
      // handled in draw
    }
    // Gentle idle bob for standing chars
    if (ch.pose === 'stand' || ch.pose === 'lean') {
      ch.bobOffset = Math.sin(frameCount * 0.03 + ch.x * 0.01) * 0.8;
    }
  });
  
  drawSalonScene();
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
