<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回响圆桌 · 知识沙龙</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#2A1E14;font-family:'Noto Sans SC',sans-serif;
    overflow:hidden;width:100vw;height:100vh;
    display:flex;align-items:center;justify-content:center;
  }
  #container{
    position:relative;width:100vw;height:100vh;
    max-width:1280px;max-height:720px;aspect-ratio:16/9;
  }
  #c{
    position:absolute;top:0;left:0;width:100%;height:100%;
    image-rendering:pixelated;image-rendering:crisp-edges;border-radius:4px;
  }
  #title-bar{
    position:absolute;top:16px;left:0;right:0;text-align:center;
    z-index:10;pointer-events:none;
    font-size:18px;font-weight:700;letter-spacing:6px;
    color:#3D2B1F;text-shadow:1px 1px 0 rgba(255,255,255,0.5);
  }
</style>
</head>
<body>
<div id="container">
<canvas id="c"></canvas>
<div id="title-bar">回 响 圆 桌</div>
</div>

<script>
const W=640,H=360,ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;
function rz(){const ct=document.getElementById('container');const s=Math.min(ct.clientWidth/W,ct.clientHeight/H);c.width=W;c.height=H;c.style.width=(W*s)+'px';c.style.height=(H*s)+'px'}
window.addEventListener('resize',rz);rz();

function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w|0,h|0)}
function L(x1,y1,x2,y2,c,w=1){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}

// ═══ Palette (Stardew x Eastward inspired) ═══
const P={
  // Room
  wall:'#FBF2DD', wain:'#EDDFBE', wainT:'#DDD0A8', base:'#CDBD90',
  floor:'#C09248', floorD:'#A87830', floorL:'#D0A860',
  // Rug
  rug:'#B8402E', rugB:'#8C2418', rugG:'#E0A050', rugC:'#D06838',
  // Wood furniture
  wd:'#5C3A1E', wdL:'#7A5230', wdD:'#3E2410',
  // Greens
  g1:'#2D6A4F', g2:'#40916C', g3:'#52B788', g4:'#74A85A', g5:'#95C86A',
  // Warm accents
  gold:'#D4A843', brass:'#B8962E', red:'#C84B31', redD:'#A03020',
  // Window
  sky:'#87CEEB', skyL:'#B8E4F0', grass:'#7CB342', hill:'#5D8A3C',
  // Board
  cork:'#C49464', corkBg:'#EDE0C8',
  paper:'#FEFAE0', ink:'#2D2D2D',
  // Shadows
  sh:'rgba(0,0,0,0.06)', shD:'rgba(0,0,0,0.12)',
};

// ═══ Topics ═══
const topics=[
  {title:'抽签玩法融合的成与败',tag:'Roguelike'},
  {title:'社交系统设计的得与失',tag:'社交'},
  {title:'AI如何重塑关卡设计',tag:'AI+游戏'},
  {title:'叙事与机制的边界',tag:'叙事'},
  {title:'商业化体验平衡',tag:'商业化'},
  {title:'开放世界内容密度',tag:'关卡'},
];

// ═══════════════════════════════════════════════
//  ROOM
// ═══════════════════════════════════════════════
function drawRoom(){
  // Wall
  R(0,0,W,112,P.wall);
  // Wainscoting
  R(0,110,W,3,P.wainT);
  R(0,112,W,10,P.wain);
  R(0,120,W,4,P.base);
  // Floor
  R(0,124,W,H-124,P.floor);
  // Floor boards (horizontal)
  for(let y=124;y<H;y+=10){L(0,y,W,y,P.floorL,0.4)}
  // Vertical seams
  for(let row=0;row<25;row++){
    const y=124+row*10,off=(row&1)?0:W/2;
    for(let x=off;x<W;x+=85+Math.sin(row*1.9)*20){
      if(x<W)L(x,y,x,y+10,P.floorD,0.3)
    }
  }
  // Subtle floor wear/patches
  R(300,260,40,8,'rgba(168,120,48,0.3)');
  R(520,290,30,6,'rgba(168,120,48,0.25)');
  
  // ═══ Persian rug (center) ═══
  const rx=200,ry=268,rw=240,rh=58;
  R(rx,ry,rw,rh,P.rug);
  R(rx+4,ry+4,rw-8,rh-8,P.rugC);
  R(rx+8,ry+8,rw-16,rh-16,P.rugG);
  // Diamond lattice
  ctx.fillStyle=P.rugB;
  for(let i=0;i<5;i++){
    const dx=rx+30+i*46,dy=ry+rh/2;
    R(dx-10,dy-5,20,10,'');
    ctx.fillStyle=P.rugB;
    ctx.fillRect(dx-8,dy-3,16,6);
  }
  // Border diamonds
  for(let sx=rx+20;sx<rx+rw-20;sx+=46){
    R(sx-3,ry+6,6,5,P.rugB);
    R(sx-3,ry+rh-11,6,5,P.rugB);
  }
  // Tassels
  for(let tx=rx+8;tx<rx+rw-8;tx+=12){
    R(tx,ry-4,2,4,P.rug);R(tx+3,ry-4,2,4,P.rug);
    R(tx,ry+rh,2,4,P.rug);R(tx+3,ry+rh,2,4,P.rug);
  }
}

// ═══════════════════════════════════════════════
//  WINDOW (left wall)
// ═══════════════════════════════════════════════
function drawWindow(x,y){
  const w=56,h=42;
  // Frame
  R(x-3,y-3,w+6,h+6,P.wdD);
  R(x,y,w,h,P.wd);
  // Sky
  R(x+3,y+3,w-6,h-6,P.sky);
  // Gradient sky
  R(x+3,y+3,w-6,12,P.skyL);
  // Hills
  R(x+3,y+h-20,w-6,8,P.hill);
  R(x+8,y+h-22,16,6,P.grass);
  R(x+30,y+h-19,20,5,P.grass);
  // Window cross
  R(x+w/2-1,y,2,h,P.wdL);
  R(x,y+h/2-1,w,2,P.wdL);
  // Light beam effect
  ctx.fillStyle='rgba(255,255,220,0.08)';
  ctx.beginPath();ctx.moveTo(x+10,y+3);ctx.lineTo(x+w-10,y+3);
  ctx.lineTo(x+w+30,y+h+40);ctx.lineTo(x-30,y+h+40);ctx.fill();
}

// ═══════════════════════════════════════════════
//  HOT TOPICS BOARD
// ═══════════════════════════════════════════════
function drawBoard(){
  const bx=16,by=16,bw=182,bh=102;
  // Frame
  R(bx-4,by-4,bw+8,bh+8,P.wdD);
  R(bx,by,bw,bh,P.cork);
  R(bx+4,by+4,bw-8,bh-8,P.corkBg);
  
  // Header
  ctx.fillStyle=P.wdD;ctx.font='bold 10px "Noto Sans SC"';
  ctx.fillText('🔥 本周热点推荐',bx+8,by+22);
  L(bx+6,by+26,bx+bw-6,by+26,P.cork,1.2);
  
  // Pinned notes
  topics.forEach((t,i)=>{
    const col=i%2,row=Math.floor(i/2);
    const cx=bx+10+col*86,cy=by+30+row*24;
    const cw=80,ch=18;
    // Paper
    R(cx,cy,cw,ch,P.paper);
    ctx.strokeStyle='#D4C4A0';ctx.lineWidth=0.5;ctx.strokeRect(cx,cy,cw,ch);
    // Pin
    R(cx+cw/2-2,cy-1.5,4,3,P.redD);
    R(cx+cw/2-1,cy-1,2,2,P.red);
    // Text
    const txt=t.title.length>10?t.title.slice(0,10)+'…':t.title;
    ctx.fillStyle=P.ink;ctx.font='bold 8px "Noto Sans SC"';
    ctx.fillText(txt,cx+4,cy+10);
    ctx.fillStyle=P.red;ctx.font='6px "Noto Sans SC"';
    ctx.fillText('#'+t.tag,cx+4,cy+16);
  });
}

// ═══════════════════════════════════════════════
//  FURNITURE (all on floor)
// ═══════════════════════════════════════════════
function drawBookshelf(x,y){
  const w=30,h=48;
  R(x,y,w,h,P.wdD);
  R(x+2,y+2,w-4,h-4,P.wd);
  for(let sy=y+7;sy<y+h-9;sy+=13){
    R(x+2,sy,w-4,3,P.wdD);
    const bks=['#C84B31','#264653','#2D6A4F','#D4A843','#8B5E3C','#457B9D','#6B3A5B','#E76F51'];
    for(let bx=x+4;bx<x+w-5;bx+=4){
      R(bx,sy+3,2.5,3+((bx*7+sy)%5),bks[(bx+sy)%bks.length|0]);
    }
  }
}

function drawTable(x,y){
  R(x+3,y+0,3,14,P.wdD);R(x+44,y+0,3,14,P.wdD);
  R(x,y-16,50,17,P.wd);R(x+2,y-14,46,13,P.wdL);
  // Items on table
  R(x+6,y-19,14,4,P.paper);         // open book
  R(x+8,y-20,3,3,'#FEFAE0');        // pages
  R(x+24,y-18,8,5,P.brass);          // mug
  R(x+33,y-20,10,8,'#BC6C25');      // small plant pot
  R(x+35,y-18,6,5,P.g3);            // leaves
}

function drawRoundTable(x,y){
  const r=18;
  // Shadow
  ctx.fillStyle=P.shD;ctx.beginPath();ctx.ellipse(x,y+3,r+3,6,0,0,Math.PI*2);ctx.fill();
  // Leg
  R(x-2,y+0,4,12,P.wdD);
  // Base
  R(x-6,y+12,12,2,P.wdD);
  // Top
  ctx.fillStyle=P.wdL;ctx.beginPath();ctx.ellipse(x,y,r,r*0.4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=P.wd;ctx.beginPath();ctx.ellipse(x,y-2,r-2,r*0.35,0,0,Math.PI*2);ctx.fill();
  // Items on round table
  R(x-8,y-5,5,4,P.brass); // small cup
  R(x+3,y-6,7,3,P.paper); // note
}

function drawStool(x,y){
  R(x+2,y-6,8,2,P.wdL);R(x+2,y-4,2,5,P.wdD);R(x+8,y-4,2,5,P.wdD);
}

function drawPlant(x,y,h=16){
  R(x,y+h-4,12,10,'#BC6C25');R(x+2,y+h-6,8,3,'#9C5A1C');
  R(x+1,y+1,3,10,P.g1);R(x+3,y-1,4,13,P.g2);
  R(x+6,y+2,3,11,P.g3);R(x+8,y+0,3,12,P.g4);
}

function drawTallPlant(x,y){
  R(x+2,y+22,14,10,'#BC6C25');R(x+4,y+20,10,3,'#9C5A1C');
  // Tall leaves
  R(x+4,y-2,3,18,P.g1);R(x+7,y-4,4,20,P.g2);
  R(x+9,y+0,3,16,P.g3);R(x+12,y-1,2,14,P.g4);
  R(x+7,y-6,3,4,P.g5);
}

function drawLamp(x,y){
  R(x+3,y+10,6,2,P.wdD);R(x+5,y-10,2,22,P.wd);
  R(x+2,y-12,8,7,P.gold);R(x+3,y-10,6,3,'#F4E8C8');
  // Glow
  ctx.fillStyle='rgba(255,240,200,0.1)';ctx.beginPath();
  ctx.arc(x+6,y,22,0,Math.PI*2);ctx.fill();
}

function drawGlobe(x,y){
  R(x+1,y+12,8,2,P.wdD);R(x+3,y-6,5,20,P.wd); // stand
  R(x-1,y-6,14,12,'#5B8C8C');                   // globe
  R(x+1,y-4,10,8,'#7AB8B8');                     // highlight
  R(x+3,y-2,3,3,'#3D6B4A');R(x+8,y-3,2,4,'#3D6B4A'); // continents
}

function drawCushion(x,y){
  R(x,y+4,16,4,P.rugG);R(x,y+2,16,3,P.rug);     // cushion
  R(x+1,y+1,14,2,P.rugG);                        // highlight
}

function drawCoatRack(x,y){
  R(x+3,y-6,2,30,P.wdD);R(x+5,y+22,5,2,P.wdD); // stand
  R(x+2,y-8,8,3,P.wd);                          // top hook bar
  R(x+1,y-8,1,4,P.wdD);R(x+7,y-8,1,4,P.wdD);    // hooks
  // Hanging coat
  R(x+7,y-6,5,10,P.red);R(x+8,y-4,3,6,P.redD);
}

function drawClock(x,y){
  // Grandfather clock
  R(x+2,y-8,14,28,P.wdD);R(x+4,y-6,10,26,P.wd);
  // Face
  R(x+4,y-4,10,10,'#FEFAE0');R(x+5,y-3,8,8,'#FFFFFF');
  // Hands
  R(x+9,y-1,2,1,P.ink);R(x+9,y-3,1,3,P.ink);
  // Pendulum
  R(x+8,y+6,2,10,P.brass);R(x+7,y+14,4,3,P.gold);
}

function drawSnackCart(x,y){
  R(x+2,y+4,24,8,P.wdD);R(x,y+0,28,5,P.wd); // counter
  R(x,y-2,3,4,P.wdD);R(x+25,y-2,3,4,P.wdD); // legs
  R(x+1,y+10,2,8,P.wdD);R(x+25,y+10,2,8,P.wdD); // wheels
  // Items
  R(x+4,y-5,7,5,P.gold);R(x+5,y-4,5,3,'#F4E8C8'); // tea pot
  R(x+14,y-4,5,4,'#FFFFFF'); // cup
  R(x+20,y-5,6,5,'#F5E6C8'); // plate with snacks
}

// ═══════════════════════════════════════════════
//  CHARACTERS (Stardew style - big head, small body)
// ═══════════════════════════════════════════════
const charDefs=[
  {name:'阿哲',sx:'#F4C9A8',hr:'#2D1B0E',hr2:'#4A2C18',top:'#264653',t2:'#1D353F',bot:'#3D3D5C',
   x:330,y:242,pose:'stand',dir:1,topic:0},
  {name:'小棠',sx:'#FDE0C8',hr:'#5C2E0A',hr2:'#7A3E18',top:'#C84B31',t2:'#9E2B20',bot:'#4A4A6A',
   x:480,y:242,pose:'stand',dir:-1,topic:1},
  {name:'青叶',sx:'#F5D6C0',hr:'#1A1A2E',hr2:'#2D2D4A',top:'#2D6A4F',t2:'#1B4332',bot:'#5A5A6A',
   x:210,y:230,pose:'sit',dir:1,topic:2,chX:188,chY:242},
  {name:'言午',sx:'#F0C8A8',hr:'#4A3520',hr2:'#6B4E30',top:'#D4A843',t2:'#B8922E',bot:'#3D3A4A',
   x:560,y:242,pose:'walk',dir:1,topic:3,wX:520,wR:[490,595]},
  {name:'蓝山',sx:'#F8D8C0',hr:'#2C1810',hr2:'#5A3830',top:'#457B9D',t2:'#1D3557',bot:'#4A4A5A',
   x:420,y:230,pose:'sit',dir:-1,topic:4,chX:398,chY:242},
  {name:'白露',sx:'#FADFC8',hr:'#1C1C1C',hr2:'#3A3A3A',top:'#E8E0D5',t2:'#C8C0B5',bot:'#4E4E6E',
   x:140,y:242,pose:'lean',dir:1,topic:5},
];

function drawChar(c,hv,f){
  const s=2.2, cx=c.x, cy=c.y-(c.pose==='sit'?6:0);
  const ox=cx-5*s, oy=cy-22*s;
  ctx.save();
  
  // Shadow
  ctx.fillStyle=P.sh;ctx.beginPath();ctx.ellipse(cx,cy+3,13,3.5,0,0,Math.PI*2);ctx.fill();
  
  // Legs
  if(c.pose==='stand'||c.pose==='lean'){
    R(ox+2*s,oy+16*s,2*s,6*s,c.bot);R(ox+8*s,oy+16*s,2*s,6*s,c.bot);
    R(ox+2*s,oy+21*s,2*s,1.5*s,'#2A2A3A');R(ox+8*s,oy+21*s,2*s,1.5*s,'#2A2A3A');
  }else if(c.pose==='sit'){
    R(ox+1*s,oy+15*s,3*s,3*s,c.bot);R(ox+1*s,oy+17*s,2*s,4*s,c.bot);
    R(ox+8*s,oy+17*s,2*s,4*s,c.bot);
  }else if(c.pose==='walk'){
    const l=Math.sin(f*0.15)*2.2;
    R(ox+2*s,oy+16*s,2*s,6*s+l,c.bot);R(ox+8*s,oy+16*s,2*s,6*s-l,c.bot);
    R(ox+2*s,oy+21*s+l*0.5,2*s,1.5*s,'#2A2A3A');R(ox+8*s,oy+21*s-l*0.5,2*s,1.5*s,'#2A2A3A');
  }
  
  // Body
  if(c.pose==='sit'){R(ox+1.5*s,oy+9*s,9*s,7*s,c.top);R(ox+1.5*s,oy+13*s,9*s,2.5*s,c.t2)}
  else{R(ox+1.5*s,oy+9*s,9*s,8*s,c.top);R(ox+1.5*s,oy+14*s,9*s,2.5*s,c.t2)}
  
  // Arms
  if(c.pose==='stand'){R(ox+0.5*s,oy+9*s,2*s,6*s,c.top);R(ox+9.5*s,oy+9*s,2*s,6*s,c.top)}
  else if(c.pose==='sit'){R(ox+0.5*s,oy+9*s,2*s,5*s,c.top);R(ox+9.5*s,oy+10*s,2*s,4*s,c.top)}
  else if(c.pose==='walk'){
    const a=Math.sin(f*0.15)*2;R(ox+0.5*s,oy+9*s,2*s,6*s+a,c.top);R(ox+9.5*s,oy+9*s,2*s,6*s-a,c.top);
  }else{R(ox+0.5*s,oy+9*s,2*s,5*s,c.top);R(ox+9*s,oy+7*s,2*s,5*s,c.top)}
  
  // Head
  R(ox+0.5*s,oy-1*s,11*s,5*s,c.hr);R(ox+0.5*s,oy+2*s,2*s,4*s,c.hr);
  R(ox+9.5*s,oy+2*s,2*s,4*s,c.hr);
  // Face
  R(ox+2*s,oy+1*s,8*s,5.5*s,c.sx);
  // Eyes
  if(c.dir>=0){R(ox+5*s,oy+3*s,2*s,1.5*s,'#1A1A1A');R(ox+9*s,oy+3*s,2*s,1.5*s,'#1A1A1A')}
  else{R(ox+4*s,oy+3*s,2*s,1.5*s,'#1A1A1A');R(ox+8*s,oy+3*s,2*s,1.5*s,'#1A1A1A')}
  // Blush
  R(ox+3*s,oy+4*s,1.5*s,1*s,'rgba(200,100,100,0.45)');R(ox+8.5*s,oy+4*s,1.5*s,1*s,'rgba(200,100,100,0.45)');
  // Mouth
  R(ox+6*s,oy+5.5*s,1.5*s,0.8*s,'#8B5E5E');
  // Hair top + bangs
  R(ox+1*s,oy,10*s,2*s,c.hr2);R(ox+2*s,oy-0.5*s,2*s,1.5*s,c.hr);R(ox+6*s,oy-0.5*s,3*s,1.5*s,c.hr);
  // Blink
  if(Math.floor(f/150)%3===0&&f%150<5)R(ox+3*s,oy+3.5*s,7*s,1*s,c.sx);
  
  // Hover
  if(hv){
    ctx.strokeStyle='rgba(212,168,67,0.7)';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.roundRect(ox-2,oy-3,14*s,24*s,3);ctx.stroke();
    ctx.fillStyle='#3D2B1F';ctx.font='bold 7px "Noto Sans SC"';ctx.textAlign='center';
    ctx.fillText('点击加入讨论',cx,oy-6);ctx.textAlign='start';
  }
  
  // Name
  ctx.fillStyle='#6B5B4A';ctx.font='6px "Noto Sans SC"';ctx.textAlign='center';
  ctx.fillText(c.name,cx,(c.pose==='sit'?cy+2:cy+6));ctx.textAlign='start';
  ctx.restore();
  
  // Bubble
  drawBubble(cx,oy-4,c.topic,hv?P.gold:P.ink);
}

function drawBubble(cx,ty,ti,color){
  const t=topics[ti],txt=t.title.length>8?t.title.slice(0,8)+'…':t.title;
  ctx.font='bold 7px "Noto Sans SC"';const tw=ctx.measureText(txt).width;
  const bw=tw+12,bh=15,bx=cx-bw/2,by=ty-bh-3;
  R(bx,by,bw,bh,'#FFFFFF');ctx.strokeStyle=color;ctx.lineWidth=0.8;ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle='#FFFFFF';ctx.beginPath();ctx.moveTo(cx-3,ty-3);ctx.lineTo(cx,ty+1);ctx.lineTo(cx+3,ty-3);ctx.fill();ctx.stroke();
  ctx.fillStyle=color;ctx.fillText(txt,bx+5,by+12);
}

function drawChair(cx,cy){
  R(cx-5,cy-6,10,3,P.wdL);R(cx-5,cy-14,2,10,P.wd);
  R(cx+3,cy-14,2,10,P.wd);R(cx-5,cy+0,2,4,P.wdD);R(cx+3,cy+0,2,4,P.wdD);
}

// ═══ Hit ═══
function hit(mx,my){
  const r=c.getBoundingClientRect(),sx=W/r.width,sy=H/r.height;
  const cx=(mx-r.left)*sx,cy=(my-r.top)*sy;
  for(let i=chars.length-1;i>=0;i--){
    const c=chars[i];const dx=cx-c.x,dy=cy-(c.y-22);
    if(dx*dx+dy*dy<24*24)return i;
  }return -1;
}

// ═══ Main ═══
let chars=charDefs.map(d=>({...d})),hv=-1,f=0;

c.addEventListener('mousemove',e=>{const h=hit(e.clientX,e.clientY);if(h!==hv){hv=h;c.style.cursor=h>=0?'pointer':'default'}});
c.addEventListener('click',e=>{const h=hit(e.clientX,e.clientY);if(h>=0)window.location.href='pixel-discussion-v3.html?topic='+encodeURIComponent(topics[chars[h].topic].title)});
c.addEventListener('mouseleave',()=>{hv=-1});

function tick(){
  f++;
  chars.forEach(c=>{
    if(c.pose==='walk'){
      c.wX+=c.dir*0.45;if(c.wX>c.wR[1]){c.dir=-1;c.wX=c.wR[1]}if(c.wX<c.wR[0]){c.dir=1;c.wX=c.wR[0]}
      c.x=c.wX;
    }
  });
  
  drawRoom();
  drawWindow(210,16);
  drawBoard();
  
  // ═══ Furniture — dense, lived-in salon ═══
  drawBookshelf(570,140);     // far right
  drawGlobe(550,210);          // next to bookshelf
  drawClock(595,135);          // tall clock right corner
  drawSnackCart(530,300);      // snack/tea cart bottom right
  drawRoundTable(150,300);     // round discussion table left
  drawStool(138,296);          // stool by round table
  drawStool(165,294);
  drawCushion(120,295);        // floor cushion left
  drawCushion(175,298);        // floor cushion near table
  drawTallPlant(30,175);       // tall plant far left
  drawPlant(420,310);          // small plant near center
  drawLamp(70,200);            // lamp left side
  drawCoatRack(80,175);        // coat rack near entrance
  drawTable(460,295);          // side table center-right
  drawChair(442,298);          // chair at side table
  
  // Chairs for seated chars
  chars.forEach(c=>{if(c.pose==='sit'&&c.chX)drawChair(c.chX,c.chY-2)});
  
  // Characters
  chars.forEach((c,i)=>drawChar(c,i===hv,f));
  
  requestAnimationFrame(tick);
}tick();
</script>
